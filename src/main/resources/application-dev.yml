# 로컬 개발 전용. 이 파일의 값은 운영에 절대 쓰지 않는다.
# H2 인메모리 DB와 개발용 소셜 로그인이 여기서만 켜진다.
spring:
  datasource:
    url: jdbc:h2:mem:morak;MODE=MySQL;LOCK_TIMEOUT=3000
    username: sa
  h2:
    console:
      enabled: true      # SQL 콘솔. 개발에서만. 무인증이라 운영에 켜면 안 된다
  jpa:
    hibernate:
      ddl-auto: update

morak:
  # 로컬 전용 비밀값. 운영은 환경변수로만 주입한다.
  jwt:
    secret: morak-local-dev-secret-key-please-change-me-32b
  security:
    social-hash-pepper: morak-local-social-hash-pepper
  dev:
    enabled: true        # 개발용 소셜 로그인(DevSocialClient) 활성화
  # base yml이 폴백 없는 ${...}로 참조하므로 dev에도 값이 있어야 기동한다.
  # 실서버 연동은 12단계이고, 그 전까지는 토큰 서명 형식 검증에만 쓰인다.
  livekit:
    host: ws://localhost:7880
    api-key: devkey
    api-secret: morak-local-livekit-secret-please-change-me
  pg:
    secret-key: morak-local-pg-test-secret
