spring:
  # 로컬 실행 기본값. 운영 배포는 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
  profiles:
    default: dev

  jpa:
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  web:
    resources:
      add-mappings: false

# 미결값·정책값은 전부 여기로 격리한다 (API명세서 v1.0 §0-6)
# 팀 확정이 오면 코드가 아니라 이 값만 바꾼다.
#
# 비밀값(jwt.secret, security.*)은 여기 두지 않는다. 공개 저장소에 커밋되고,
# 폴백을 두면 운영에서 환경변수를 빠뜨려도 그 값으로 조용히 뜬다. dev 값은
# application-dev.yml, 운영은 환경변수로만 주입한다.
morak:
  timezone: Asia/Seoul

  jwt:
    secret: ${MORAK_JWT_SECRET}
    expire-hours: 24

  security:
    media-token-secret: ${MORAK_MEDIA_TOKEN_SECRET}
    social-hash-pepper: ${MORAK_SOCIAL_HASH_PEPPER}

  dev:
    enabled: false          # dev 프로필에서만 true. @Profile("dev")와 AND 조건

  match:
    expire-hours: 24       # 매칭 대기 유효 시간

  proof:
    deadline-from: "06:00" # 인증 가능 시작
    deadline-to: "23:59"   # 인증 마감
    face-retry-limit: 10   # 얼굴 감지 재촬영 일 한도
    screening-timeout-minutes: 10  # B7 회수 임계

  ai:
    boundary: 0.05                 # 완주 판정 경계 구간 폭
    phash-hamming-threshold: 5     # 사진 재사용 판정
    relevance-threshold: 0.30      # 목표 관련성 최소 점수
    relevance-shadow: true         # true면 기록만, 기준선 확보 후 false로 전환해 차단 시작

  completion:
    personal-proof-rate: 0.7       # [팀 확정 대기] 개인 완주 기준
    group-avg-proof-rate: 0.6      # [팀 확정 대기] 그룹 완주 기준

  report:
    sla-hours:
      high: 24
      normal: 72

  media:
    retention-days: 30             # 챌린지 종료 후 촬영물 보관

  storage:
    local-path: ./storage          # 11단계에 S3로 교체

  withdrawal:
    grace-days: 30
