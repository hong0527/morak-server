spring:
  # 로컬 실행 기본값. 운영 배포는 SPRING_PROFILES_ACTIVE=prod 로 덮어쓴다.
  profiles:
    default: dev

  jpa:
    # 뷰까지 영속성 컨텍스트를 끌고 가지 않는다. 켜 두면 컨트롤러·직렬화 단계에서 지연 로딩이
    # 조용히 성공해, 서비스 밖으로 준영속 엔티티를 내보내는 코드가 테스트에서 드러나지 않는다.
    # DTO 변환은 Service에서 한다는 규칙(CLAUDE.md §4-2)과 같은 이야기다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          # 여러 행을 한 트랜잭션에서 쓰는 경로(매칭 6인 확정, B1 완주 지급, B4 탈퇴 파기)의
          # JDBC 왕복을 묶는다.
          #
          # 다만 INSERT는 지금 묶이지 않는다. 모든 엔티티가 GenerationType.IDENTITY라
          # persist() 직후 생성 키를 읽어야 하고, 그래서 Hibernate가 INSERT를 미루지 못한다.
          # 실측(6인 확정): 이 설정 전후 모두 session_participant INSERT 6문장으로 동일했다.
          # 지금 효과가 있는 것은 UPDATE·DELETE 배치 쪽이다. INSERT까지 묶으려면 키 전략을
          # 바꿔야 하는데, 그것은 MySQL 전환(12단계)에서 함께 볼 문제다.
          batch_size: 30
        # 같은 테이블의 INSERT가 연속해야 배치가 끊기지 않는다. 위 이유로 지금은 실효가
        # 없지만, 키 전략이 바뀌는 순간 이 값이 없으면 batch_size만으로는 묶이지 않는다.
        order_inserts: true
  web:
    resources:
      add-mappings: false

# 미결값·정책값은 전부 여기로 격리한다 (API명세서 v2.0 §0-5)
# 팀 확정이 오면 코드가 아니라 이 값만 바꾼다.
#
# 비밀값(jwt.secret, security.*, livekit.*, pg.secret-key)은 여기 두지 않는다. 공개 저장소에
# 커밋되고, 폴백을 두면 운영에서 환경변수를 빠뜨려도 그 값으로 조용히 뜬다. dev 값은
# application-dev.yml, 운영은 환경변수로만 주입한다.
morak:
  timezone: Asia/Seoul

  jwt:
    secret: ${MORAK_JWT_SECRET}
    expire-hours: 24

  security:
    social-hash-pepper: ${MORAK_SOCIAL_HASH_PEPPER}

  dev:
    enabled: false          # dev 프로필에서만 true. @Profile("dev")와 AND 조건

  scheduling:
    enabled: true           # 배치(B1·B2·B4·B5)와 재접속 유예 스위퍼. 테스트만 false로 끈다

  match:
    # 매칭 조건의 전부. 이 목록이 곧 match_lock 조건 행이라 값을 바꾸면 시더가 새 행을 만든다.
    target-minutes-options: 60,120,180,240   # [팀 확정 대기] D8 잠정값
    wait-expire-minutes: 10          # 대기 만료 (D8)
    rematch-cooldown-minutes: 30     # 퇴출자 재매칭 쿨다운 (D14)

  session:
    absence-threshold-seconds: 60    # [팀 확정 대기] 경고 부여 임계 (★D4)
    absence-min-interval-seconds: 5  # [팀 확정 대기] SS-4 이벤트 최소 간격. 미만이면 429
    # [팀 확정 대기] 첫 경고 뒤 추가 경고가 붙는 눈금. 임계와 같게 두면 3분 남짓 한 번에
    # 곧바로 퇴출이라, 한 구간만으로 퇴출되는 지점을 화장실 상한(10분) 뒤로 밀어 둔다
    absence-warning-escalation-seconds: 300
    evict-warning-count: 3           # 퇴출 누적 경고 수
    reconnect-grace-seconds: 90      # 재접속 유예 (D13)
    pause-limit-minutes: 10          # 화장실 모드 상한 (D9)
    min-participants: 2              # 미만이면 조기 종료 (D12)
    required-participants: 6         # 매칭 확정 인원

  point:                             # [팀 확정 대기] D15 잠정값
    welcome: 1000
    session-complete-per-hour: 100
    eviction-penalty: 300
    goal-achieved: 1000

  report:
    sla-hours:
      high: 24
      normal: 72

  appeal:
    # 퇴출 시각부터 이의를 접수하는 기한(AP-1). 정각까지는 접수한다 — 경계 포함 방향은
    # 제재 종료·충전 만료·탈퇴 파기와 같이 사용자에게 유리한 쪽이다.
    file-deadline-days: 3

  withdrawal:
    grace-days: 30

  livekit:
    # host는 비밀값이 아니지만 환경별로 갈리므로 같은 방식으로 주입한다.
    host: ${MORAK_LIVEKIT_HOST}
    api-key: ${MORAK_LIVEKIT_API_KEY}
    api-secret: ${MORAK_LIVEKIT_API_SECRET}
    token-ttl-seconds: 3600          # SS-2 접속 토큰 유효 시간

  pg:
    provider: toss-test              # [팀 확정 대기] D16 잠정값
    secret-key: ${MORAK_PG_SECRET_KEY}
    point-per-krw: 1                 # [팀 확정 대기] D-6 잠정값. 1원 = 1포인트
    min-amount-krw: 1000             # [팀 확정 대기] 1회 충전 하한. 미만이면 400
    max-amount-krw: 1000000          # [팀 확정 대기] 1회 충전 상한. 초과면 400
    # 승인도 실패도 오지 않은 READY를 닫는 기한(B5). PG 승인 API가 결제창 생성 후 10분까지만
    # 받으므로 그 배를 여유로 둔다. 이보다 짧으면 정상 결제가 닫히고, 없으면 READY가 영구 잔존한다.
    ready-expire-minutes: 30
