          type: string
          description: 대상 표시명
          example: 익명 여우12
        reasonCode:
          $ref: '#/components/schemas/ReportReasonCode'
        severity:
          $ref: '#/components/schemas/ReportSeverity'
        status:
          $ref: '#/components/schemas/ReportStatus'
        overdue:
          type: boolean
          description: 처리 기한(`slaDueAt`) 초과 여부
          example: false
        receivedAt:
          type: string
          format: date-time
          description: 접수 시각
          example: '2026-08-12T14:30:00+09:00'
        slaDueAt:
