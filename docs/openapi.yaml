  /webhooks/livekit:
    post:
      tags:
      - 라이브 세션
      summary: SS-10 LiveKit 입퇴장 웹훅
      operationId: handleLivekitWebhook
      description: "실제 입퇴장·연결 끊김의 진실 원천입니다. **LiveKit이 호출하는 경로이며 클라이언트가 부르지 않습니다.**\n\
        \n- JWT·회원상태·제재·연령 게이트를 전부 건너뜁니다. 서명 검증이 유일한 신원 보장 수단입니다.\n- 처리 이벤트\n  |\
        \ event | 처리 |\n  | --- | --- |\n  | `participant_joined` | 최초 입장 시각 기록(1회만).\
        \ 유예 타이머가 걸려 있으면 해제 |\n  | `participant_left` | 재접속 유예 타이머 시작 |\n  | `room_finished`\
        \ | 룸 종료 확인. 세션이 아직 진행 중이면 종료 루틴 실행 |\n- **연결 끊김은 자리비움 경고와 별개 축입니다.** 유예\
        \ 시간 안에 돌아오면 아무 일도 일어나지 않고 기록도 남기지 않습니다.\n  넘기면 `LEFT(DEVICE_ISSUE)`로 자동 처리되며\
        \ 경고·포인트 차감 없이 그 세션만 미완주입니다.\n- 이미 퇴장했거나 퇴출된 참가자에게는 유예 타이머를 걸지 않습니다.\n- 알\
        \ 수 없는 `identity`는 200으로 흡수하고 로그만 남깁니다. 처리 실패도 200입니다 — 5xx를 내면 재시도가 반복돼 중복\
        \ 처리가 늘어납니다.\n"
      security: []
      parameters:
      - name: Authorization
        in: header
        required: true
        description: 'LiveKit 웹훅 서명(LiveKit이 `livekit.api-secret`으로 서명한 토큰).
          불일치·누락은 401 `INVALID_WEBHOOK_SIGNATURE`'
        schema:
          type: string
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LivekitWebhookRequest'
      responses:
        '200':
          description: 수신 확인
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '401':
          $ref: '#/components/responses/InvalidWebhookSignature'
  /stickers:
    get:
      tags:
      - 라이브 세션
      summary: SS-11 스티커 종류 목록
      operationId: getStickers
      description: "세션 중 보낼 수 있는 정형 스티커 종류를 내려줍니다. 자유 텍스트 채팅은 지원하지 않습니다.\n\n- **스티커\
        \ 전송은 LiveKit 데이터 채널로 클라이언트 간 직접 이뤄지며 서버는 저장하지 않습니다.**\n  이 API는 종류 목록만 제공합니다.\n"
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StickerListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
  /evictions/{evictionId}/appeals:
    post:
      tags:
      - 이의 신청
      summary: AP-1 퇴출 이의 신청
      operationId: createAppeal
      description: "AI 3회 경고 퇴출에 대해 운영진 2차 개입을 요청합니다.\n\n- `reasonText`는 필수이며 최대 200자입니다.\
        \ 관리자가 판단할 유일한 사용자 측 근거라 선택 항목으로 두지 않습니다.\n- **퇴출 1건당 1회만 신청할 수 있습니다.**\n\
        - **신청 기한은 퇴출 시각부터 3일입니다.** 정각까지는 접수하고, 지나면 409 `APPEAL_DEADLINE_PASSED`입니다.\n\
        - 타인의 퇴출 건이거나 존재하지 않는 `evictionId`는 모두 403입니다. 존재 여부를 노출하지 않기 위해 404를 쓰지 않습니다.\n\
        - 신청만으로는 퇴출·포인트 차감이 되돌아가지 않습니다. 원복은 관리자가 인용했을 때만 일어납니다.\n"
      parameters:
      - $ref: '#/components/parameters/EvictionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealCreateRequest'
      responses:
        '201':
          description: 접수 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `FORBIDDEN` 본인의 퇴출 건이 아니거나 존재하지 않는 퇴출 건

            · `WITHDRAWAL_PENDING` / `AGE_NOT_VERIFIED` 게이트 차단

            · `MEMBER_SANCTIONED`는 발생하지 않습니다 — 이의는 제재 게이트의 예외라 제재 중에도 신청할 수 있습니다.
            구제 경로를 제재로 막으면 이의 기한이 손도 못 대고 지나갑니다

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '충돌

            · `APPEAL_ALREADY_FILED` 이 퇴출 건에 이미 이의를 신청함 — 기한이 지난 뒤의 재전송에도 이 코드가 먼저입니다

            · `APPEAL_DEADLINE_PASSED` 퇴출 시각부터 3일 초과

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me/appeals:
    get:
      tags:
      - 이의 신청
      summary: AP-2 내 이의 목록
      operationId: getMyAppeals
      description: "신청한 이의의 처리 상태와 결과를 확인합니다. 인용·기각을 사용자가 알 수 있는 유일한 화면입니다.\n\n\
        - `PENDING`이면 `decidedAt`·`pointRefunded`·`sessionCompletedRestored`는 전부 `null`입니다.\
        \ `REJECTED`면 `decidedAt`만 채워집니다.\n- 관리자 처리 사유(note)는 내려가지 않습니다 — 내부 판단 기록입니다.\n\
        - 정렬은 접수 시각 내림차순(동률은 이의 번호 내림차순)입니다.\n- **제재 중에도 조회할 수 있습니다** — 신청(AP-1)과 같은\
        \ 게이트 예외입니다. 결과 확인도 구제 경로의 일부입니다.\n"
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyAppealPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '게이트 차단

            · `WITHDRAWAL_PENDING` / `AGE_NOT_VERIFIED`

            · `MEMBER_SANCTIONED`는 발생하지 않습니다 — 결과 확인도 구제 경로의 일부라 제재 게이트의 예외입니다

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me/points:
    get:
      tags:
      - 포인트
      summary: PT-1 포인트 잔액·원장 조회
      operationId: getMyPoints
      description: "잔액과 적립·차감 내역을 보여줍니다. **잔액의 진실은 원장입니다.**\n\n- `reasonLabel`은 서버가\
        \ `reason`에서 파생하는 표시용 문자열이며 저장하지 않습니다. 사유별 분기는 문구가 아니라 `reason`으로 하세요.\n\
        \  WELCOME=웰컴 포인트 / SESSION_COMPLETE=세션 완주 / GOAL_ACHIEVED=스파크 포인트(목표 달성) /\
        \ EVICTION_PENALTY=퇴출 패널티 / ORDER_SPEND=상품 구매 / ORDER_CANCEL=주문 취소 환급 /\
        \ CHARGE=포인트 충전 / APPEAL_REFUND=이의 인용 환급\n- **정렬은 `ledgerId` 내림차순(기록된 순서의 역순)입니다.**\
        \ `balanceAfter`가 기록 순서로 연쇄하므로 표시 순서도 같아야 합니다 — 시각으로 정렬하면 목록 안에서\
        \ 잔액이 오르내립니다.\n- `createdAt`은 그 줄을 쓴 시각입니다. 정산 대상 사건의 시각은 `refType`·`refId`가\
        \ 가리키는 근거 행이 말합니다. 이의 인용이 이틀 전 세션의 완주를 소급 지급해도 그 줄은 인용 시각입니다.\n\
        - 정정은 기존 행 수정이 아니라 반대 부호의 새 행(역분개)으로\
        \ 들어옵니다.\n"
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PointBalanceResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
  /store/products:
    get:
      tags:
      - 스토어
      summary: SR-1 상품 목록
      operationId: getProducts
      description: "포인트로 교환 가능한 기프티콘·제휴 서적 목록입니다.\n\n- `HIDDEN` 상품은 응답에 포함되지 않습니다.\n\
        - 도서는 제휴 재고 정책을 따르며 소진 시 `SOLD_OUT`으로 즉시 구매가 제한됩니다.\n- 상세 설명·이미지는 목록에 싣지\
        \ 않습니다. SR-2에서 받습니다.\n"
      parameters:
      - name: type
        in: query
        required: false
        description: 상품 종류 필터. 생략하면 전체
        schema:
          $ref: '#/components/schemas/ProductType'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
  /store/products/{productId}:
    get:
      tags:
      - 스토어
      summary: SR-2 상품 상세
      operationId: getProduct
      description: "상품 하나의 상세 정보입니다.\n\n- `description`·`imageUrl`은 등록되지 않았으면 `null`로\
        \ 내려갑니다.\n- 존재하지 않거나 `HIDDEN`인 상품은 모두 404입니다.\n- 장바구니는 보류입니다.\n"
      parameters:
      - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '404':
          description: '`PRODUCT_NOT_FOUND` 존재하지 않거나 감춰진 상품'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /orders:
    post:
      tags:
      - 스토어
      summary: SR-3 주문 생성
      operationId: createOrder
      description: "보유 포인트로 상품을 주문합니다. **포인트 전액 결제만 지원합니다.**\n\n- `idempotencyKey`는\
        \ 주문 화면 진입 시 만들어 재시도까지 같은 값으로 보냅니다.\n  중복이면 409 `DUPLICATE_ORDER`이고 `details.orderId`에\
        \ 기존 주문 번호가 담깁니다.\n  클라이언트는 이 값으로 주문 상세 화면으로 넘어가면 됩니다.\n- 재고와 포인트는 모두 조건부\
        \ 차감이라 잔액·재고가 모자라면 전부 롤백됩니다.\n- **주문 이행은 v1 범위 밖입니다.** 발송 코드·수령 연락처·배송 상태를\
        \ 다루지 않으며 실제 발송은 운영자가 수동으로 처리합니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
      responses:
        '201':
          description: 주문 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '404':
          description: '`PRODUCT_NOT_FOUND` 존재하지 않거나 감춰진 상품'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '주문할 수 없는 상태

            · `DUPLICATE_ORDER` 같은 `idempotencyKey`로 이미 접수됨 (`details.orderId`)

            · `OUT_OF_STOCK` 재고 부족·품절

            · `INSUFFICIENT_POINT` 포인트 잔액 부족 → 충전 안내

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: DUPLICATE_ORDER
                  message: 이미 접수된 주문입니다.
                  details:
                    orderId: 612
    get:
      tags:
      - 스토어
      summary: SR-4 내 주문 목록
      operationId: getMyOrders
      description: "내가 접수한 주문 목록입니다.\n\n- 환불·주문 취소·배송 상태 조회는 보류입니다.\n"
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
  /orders/{orderId}:
    get:
      tags:
      - 스토어
      summary: SR-5 주문 상세
      operationId: getOrder
      description: "주문 목록 항목에 멱등키와 원장 참조가 더해진 형태입니다.\n"
      parameters:
      - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `FORBIDDEN` 타인의 주문

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`ORDER_NOT_FOUND` 존재하지 않는 주문'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /points/charges:
    post:
      tags:
      - 결제
      summary: PY-1 포인트 충전 생성
      operationId: createCharge
      description: "부족한 포인트를 결제로 충전하기 위해 PG 주문을 만듭니다. v1은 웹 PG 테스트 모드 1회 왕복만 지원합니다.\n\
        \n- 이 시점에는 포인트가 늘지 않습니다. 클라이언트는 `pgOrderId`로 PG 결제창을 띄웁니다.\n- 환산 비율은 1원 =\
        \ 1포인트입니다.\n- 인앱결제(IAP)는 보류입니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeCreateRequest'
      responses:
        '201':
          description: 충전 건 생성
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
  /points/charges/{chargeId}/confirm:
    post:
      tags:
      - 결제
      summary: PY-2 충전 승인 확인
      operationId: confirmCharge
      description: "PG 결제창에서 돌아온 클라이언트가 승인을 확정하고 포인트를 적립받습니다.\n\n- **이미 승인된 건을 다시\
        \ 호출해도 같은 200 응답이 옵니다(멱등).** 웹훅과 동시에 처리돼도 이중 적립은 일어나지 않습니다.\n- 클라이언트가 보낸\
        \ 금액을 믿지 않습니다. 충전 건 금액과 다르면 400 `PAYMENT_AMOUNT_MISMATCH`입니다.\n- 결제가 승인되지\
        \ 않았거나 이미 실패로 확정된 건은 409 `PAYMENT_NOT_APPROVED`이며, 포인트는 적립되지 않습니다.\n- PG가\
        \ 알려준 승인 금액이 충전 건 금액과 다르면 충전 건을 실패로 닫고 400 `PAYMENT_AMOUNT_MISMATCH`입니다.\n\
        - 다른 충전 건이 이미 쓴 `pgTid`를 보내면 이 건은 승인되지 않은 채 409 `PAYMENT_NOT_APPROVED`입니다.\n"
      parameters:
      - $ref: '#/components/parameters/ChargeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChargeConfirmRequest'
      responses:
        '200':
          description: 승인 확인·적립 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargeConfirmResponse'
        '400':
          description: '요청 오류

            · `PAYMENT_AMOUNT_MISMATCH` 주문번호·금액이 충전 건과 일치하지 않음

            · `VALIDATION_FAILED` `pgOrderId`·`pgTid`가 비었거나 64자를 넘음

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '404':
          description: '`CHARGE_NOT_FOUND` 존재하지 않거나 타인의 충전 건'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`PAYMENT_NOT_APPROVED` PG 미승인·실패 상태, 또는 승인 기한(결제창 생성 후 30분)이 지난 `READY` — 이 경우 충전 건을 `FAILED`로 닫고 응답합니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /webhooks/payment:
    post:
      tags:
      - 결제
      summary: PY-3 PG 결제 웹훅
      operationId: handlePaymentWebhook
      description: "클라이언트가 결제창에서 이탈해 PY-2를 호출하지 못한 경우에도 승인 결과를 반영합니다.\n**PG가 호출하는\
        \ 경로이며 클라이언트가 부르지 않습니다.**\n\n- JWT·회원상태·제재·연령 게이트를 전부 건너뜁니다. 서명 검증이 유일한 인증입니다.\n\
        - `status=DONE`이면 PY-2와 같은 서비스 메서드를 호출합니다. 몇 번 재수신돼도 적립은 1회입니다.\n- 취소·중단·만료는\
        \ 충전 건을 실패로 기록합니다. 금액이 맞지 않으면 적립하지 않고 실패로 남깁니다.\n- 알 수 없는 주문번호는 200으로 흡수하고\
        \ 로그만 남깁니다(재시도 폭주 방지).\n"
      security: []
      parameters:
      - name: X-Morak-Signature
        in: header
        required: true
        description: '본문 바이트의 HMAC-SHA256(키: `morak.pg.secret-key`)을 소문자 hex로 인코딩한 값.
          불일치·누락은 401 `INVALID_WEBHOOK_SIGNATURE`'
        schema:
          type: string
        example: 8ff0776abe59a63784b3dc2665f8b5d220150bf9ce9db4696cdcd3e7262c6559
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookRequest'
      responses:
        '200':
          description: 수신 확인
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '401':
          $ref: '#/components/responses/InvalidWebhookSignature'
  /reports:
    post:
      tags:
      - 신고
      summary: RP-1 신고·재매칭 차단
      operationId: createReport
      description: "불쾌한 유저나 세션을 신고하고, 그 즉시 해당 유저와의 재매칭을 영구 차단합니다.\n\n- `targetType=MEMBER`면\
        \ `targetMemberId`와 `sessionId`가 모두 필요합니다. `SESSION`이면 `sessionId`만 보냅니다.\n\
        - 요청자와 대상이 같은 세션 참가 이력을 가져야 합니다.\n- 같은 대상의 처리 대기 케이스가 있으면 신고자만 추가로 병합됩니다.\
        \ 같은 케이스에 이미 신고했으면 409입니다.\n- **차단은 영구이며 해제 API가 없습니다.** 양방향으로 등재돼 다음 매칭부터\
        \ 즉시 반영됩니다.\n- **아무도 세션에서 나가지 않습니다.** 신고자도 피신고자도 세션에 남고, 상호 비노출(타일 가리기)은 클라이언트가\
        \ 처리합니다.\n  피신고자에 대한 조치는 운영자가 확정한 뒤에만 적용됩니다.\n- **연령 게이트를 적용하지 않습니다.** 안전\
        \ 도구는 막지 않습니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportCreateRequest'
      responses:
        '201':
          description: 신고 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCreateResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 대상과 같은 세션 참가 이력이 없음

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`TARGET_NOT_FOUND` 신고 대상 회원·세션이 없음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`DUPLICATE_REPORT` 같은 케이스에 이미 신고함'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/reports:
    get:
      tags:
      - 관리자
      summary: AD-1 신고 케이스 목록
      operationId: getAdminReports
      description: "운영자 처리 큐입니다.\n\n- **`overdue`는 저장 컬럼이 아니라 조회 시점의 파생값입니다** — 처리\
        \ 대기 상태이면서 SLA 기한이 지난 케이스.\n  `overdue=true` 필터도 같은 조건을 붙이는 것이며 마킹 배치가 없으므로\
        \ 조회 시각이 곧 판정 시각입니다.\n- SLA는 고위험 24시간, 일반 72시간입니다.\n- 정렬은\
        \ `slaDueAt` 오름차순(동률은 `caseId` 오름차순)입니다.\n"
      parameters:
      - name: status
        in: query
        required: false
        description: 케이스 상태 필터
        schema:
          $ref: '#/components/schemas/ReportStatus'
      - name: severity
        in: query
        required: false
        description: 등급 필터
        schema:
          $ref: '#/components/schemas/ReportSeverity'
      - name: overdue
        in: query
        required: false
        description: SLA 초과 건만 보기
        schema:
          type: boolean
      - name: q
        in: query
        required: false
        description: 대상 표시명 검색어
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCasePageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /admin/reports/{caseId}:
    get:
      tags:
      - 관리자
      summary: AD-2 신고 케이스 상세
      operationId: getAdminReportDetail
      description: "판단에 필요한 대상 이력을 한 화면에 모읍니다.\n\n- `reporters[].detail`은 신고 사유만 담고\
        \ 신고자 신원은 노출하지 않습니다.\n- **세션 영상은 저장하지 않으므로 열람 대상이 없습니다.** 판단 근거는 세션 이력·경고\
        \ 로그·신고 사유입니다.\n"
      parameters:
      - $ref: '#/components/parameters/CaseId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCaseDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`REPORT_NOT_FOUND` 존재하지 않는 케이스'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - 관리자
      summary: AD-3 신고 처리
      operationId: processReport
      description: "케이스를 종결합니다.\n\n- **처리 대기 상태만 변경할 수 있습니다. 재오픈은 불가하며 재검토는 새 케이스로\
        \ 만듭니다.**\n- `status=SANCTIONED`면 `sanction`이 필수이고, 제재 적용은 AD-4와 같은 단일 메서드가\
        \ 한 트랜잭션에서 처리합니다.\n- `status=REJECTED`(기각)로 확정하면 신고자에게 제재 검토 플래그가 붙습니다.\n \
        \ 반복 허위 신고자를 남기기 위한 장치이며, **이것이 그 플래그를 세우는 유일한 경로입니다.**\n  SLA 초과를 근거로 자동 마킹하지\
        \ 않습니다 — 처리가 늦은 것은 운영 측 사정입니다.\n- 재매칭 차단은 신고 접수 시점에 이미 등재됐으므로 여기서 추가 처리하지\
        \ 않습니다.\n"
      parameters:
      - $ref: '#/components/parameters/CaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportProcessRequest'
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportProcessResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`REPORT_NOT_FOUND` 존재하지 않는 케이스'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ALREADY_PROCESSED` 이미 종결된 케이스'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /admin/members/{memberId}/sanctions:
    post:
      tags:
      - 관리자
      summary: AD-4 제재 단독 적용
      operationId: createSanction
      description: "신고 케이스를 거치지 않고 제재를 적용합니다.\n\n- `type=PERMANENT`면 `days`를 받지 않고\
        \ `endsAt`이 `null`이 됩니다.\n- 적용 즉시 진행 중이던 세션에서 퇴장 처리되고 대기 중인 매칭 요청이 취소됩니다.\n\
        \  이때 남은 인원이 최소 인원 미만이 되면 세션도 함께 조기 종료됩니다.\n- 발효 직후부터 제재 게이트가 참여 API를 전부 막습니다.\n"
      parameters:
      - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanctionCreateRequest'
      responses:
        '201':
          description: 제재 적용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanctionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /admin/appeals:
    get:
      tags:
      - 관리자
      summary: AD-5 이의 큐
      operationId: getAdminAppeals
      description: "퇴출 이의 신청 처리 큐입니다.\n\n- `overdue`는 신고 케이스와 같은 규칙의 파생값입니다 — 처리 대기\
        \ 상태이면서 SLA 기한이 지난 건.\n"
      parameters:
      - name: status
        in: query
        required: false
        description: 이의 상태 필터
        schema:
          $ref: '#/components/schemas/AppealStatus'
      - name: overdue
        in: query
        required: false
        description: SLA 초과 건만 보기
        schema:
          type: boolean
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /admin/appeals/{appealId}:
    get:
      tags:
      - 관리자
      summary: AD-9 이의 심사 상세
      operationId: getAppealDetail
      description: "인용·기각 판단의 재료를 한 번에 내립니다.\n\n- `reasonText`는 관리자가 판단할 유일한\
        \ 당사자 진술입니다.\n- 경고별 근거 구간은 판정에 쓰인 것과 같은 규칙으로 되짚습니다. Pause 초과 경고는 근거 이벤트가\
        \ 없어 구간 계열 필드가 전부 null입니다.\n- `concurrentReporterCount`는 같은 구간에 미검출을 보고한 다른\
        \ 참가자 수입니다 — 집계 수치만 내리고 명단은 내리지 않습니다.\n- 영상은 저장하지 않으므로 재실 여부를 확정하는 필드는 없습니다.\
        \ 개연성 판단의 재료입니다.\n"
      parameters:
      - $ref: '#/components/parameters/AppealId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`APPEAL_NOT_FOUND` 존재하지 않는 이의'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - 관리자
      summary: AD-6 이의 처리
      operationId: processAppeal
      description: "이의를 인용하거나 기각합니다.\n\n- **인용해도 퇴출 기록 자체는 남깁니다(감사 추적).** 참가자 상태는\
        \ 퇴출로 유지하고 취소 사실은 별도 시각으로 표현합니다.\n- 인용 시 패널티는 역분개로 되돌아가고, 원래의 차감 행은 지우지 않습니다.\n\
        - 인용 시 완주를 소급 재판정합니다 — 퇴출이 없었다면 세션 종료까지 참가한 것으로 보아 완주 처리하고 포인트를 지급합니다.\n \
        \ Streak도 함께 재계산되며 목표 달성 조건을 채우면 달성 처리됩니다.\n  단, 세션이 아직 진행 중이면 완주 여부가 정해지지\
        \ 않았으므로 인용 자체를 409 `SESSION_NOT_ENDED`로 거절하고\n  이의는 대기 상태로 남습니다 — 기각은 세션 상태와 무관하게 언제든 가능합니다.\n- 되돌릴 차감이 아직 원장에 없으면 역분개도\
        \ 만들지 않습니다(`pointRefunded=0`). 역분개는 기존 기록을 뒤집는 것이지 새 지급이 아닙니다.\n- 재매칭 쿨다운은\
        \ 인용 시점부터 해제됩니다.\n- 기각이면 상태와 메모만 기록하고 원복은 일어나지 않습니다.\n"
      parameters:
      - $ref: '#/components/parameters/AppealId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealProcessRequest'
      responses:
        '200':
          description: 처리 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealProcessResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`APPEAL_NOT_FOUND` 존재하지 않는 이의'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ALREADY_PROCESSED` 이미 처리된 이의(파기로 CLOSED가 된 건 포함) / `APPEAL_MEMBER_PURGED`
            신청자 계정이 파기되어 심사 근거가 없음 / `SESSION_NOT_ENDED` 진행 중 세션의 인용'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/sessions:
    get:
      tags:
      - 관리자
      summary: AD-7 진행 중 세션 모니터
      operationId: getAdminSessions
      description: "진행 중인 세션과 참가자 상태를 봅니다.\n\n- **관리자에게도 영상은 제공하지 않습니다.** 저장하지 않으므로\
        \ 존재하지 않습니다.\n- `status`를 생략하면 종료된 세션까지 함께 나옵니다.\n- 이의가 인용된 퇴출도 `evictedCount`에\
        \ 남습니다 — 참가자 상태는 퇴출로 유지되고 취소 사실은 별도 시각으로 표현하기 때문입니다.\n- 조회 전용입니다. 관리자가 세션에\
        \ 개입하는 경로는 v1 범위 밖입니다.\n"
      parameters:
      - name: status
        in: query
        required: false
        description: 세션 상태 필터
        schema:
          $ref: '#/components/schemas/SessionStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSessionPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /admin/withdrawals:
    get:
      tags:
      - 관리자
      summary: AD-8 탈퇴 처리 결과
      operationId: getWithdrawals
      description: "탈퇴 신청과 파기 처리 결과를 봅니다.\n\n- 실제 파기는 매일 도는 배치가 수행하며, 파기 전이면 `deletedAt`이\
        \ `null`입니다.\n- 커머스 기록은 법정 보존 대상이라 파기에서 제외되고 개인 식별자만 익명화됩니다.\n"
      parameters:
      - name: status
        in: query
        required: false
        description: 회원 상태 필터. 생략하면 두 상태를 함께 내립니다. 그 외 값은 400입니다
        schema:
          type: string
          enum:
          - WITHDRAW_PENDING
          - DELETED
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /dev/clock:
    post:
      tags:
      - 개발 전용
      summary: DEV-2 개발 전용 시각 조작
      operationId: setDevClock
      description: >
        가변 Clock을 고정하거나 오프셋을 설정합니다. Streak 일 경계·만료 판정 테스트에 씁니다.


        **개발 전용이며 공개 계약이 아닙니다.** 운영 프로필에서는 빈이 등록되지 않아 404입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevClockRequest'
      responses:
        '200':
          description: 조작 적용됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevClockResponse'
        '400':
          description: '`VALIDATION_FAILED` 조작 명령이 없거나 둘 이상'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/DevEndpointNotFound'
    get:
      tags:
      - 개발 전용
      summary: DEV-2 개발 전용 현재 시각 조회
      operationId: getDevClock
      description: >
        조작이 반영된 서버 현재 시각과 모드를 돌려줍니다. 게이트가 시각 기반 판정을 실측하려면
        "지금 서버가 몇 시로 보고 있는가"를 알아야 합니다.


        **개발 전용이며 공개 계약이 아닙니다.** 운영 프로필에서는 빈이 등록되지 않아 404입니다.
      security: []
      responses:
        '200':
          description: 현재 시각·모드
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevClockResponse'
        '404':
          $ref: '#/components/responses/DevEndpointNotFound'
  /dev/sessions/seed:
    post:
      tags:
      - 개발 전용
      summary: DEV-3 개발 전용 완주 이력 시드
      operationId: seedDevSessions
      description: >
        지정한 일자들에 완주한 세션·참가 행·Streak 기록을 만듭니다. 완주 처리는 직접 하지 않고
        세션 종료 루틴과 같은 경로를 부르므로, 시드로 만든 상태에서만 통과하는 게이트가 생기지 않습니다.


        **개발 전용이며 공개 계약이 아닙니다.** 운영 프로필에서는 빈이 등록되지 않아 404입니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DevSessionSeedRequest'
      responses:
        '200':
          description: 시드 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevSessionSeedResponse'
        '400':
          description: '`VALIDATION_FAILED` 없는 회원이거나 `dates` 누락·형식 오류'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/DevEndpointNotFound'
  /dev/batches/{name}:
    post:
      tags:
      - 개발 전용
      summary: DEV-4 개발 전용 배치 트리거
      operationId: triggerDevBatch
      description: >
        해당 배치를 즉시 실행합니다. 요청 본문은 없습니다.


        - B1 세션 종료 · B2 대기 만료 · B4 탈퇴 파기 · B5 충전 승인 기한 만료. 모든 배치는 재실행이 안전합니다.

        - SLA 마킹 배치(구 B3)는 폐지돼 트리거 대상이 아닙니다. 없는 이름은 404입니다.


        **개발 전용이며 공개 계약이 아닙니다.** 운영 프로필에서는 빈이 등록되지 않아 404입니다.
      security: []
      parameters:
      - $ref: '#/components/parameters/BatchName'
      responses:
        '200':
          description: 배치 실행됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevBatchResponse'
        '404':
          description: '`ENDPOINT_NOT_FOUND`

            · 운영 프로필이라 이 엔드포인트가 등록되지 않음

            · 등록되지 않은 배치 이름(폐지된 구 B3 포함)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
