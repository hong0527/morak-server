      required:
      - caseId
      - targetType
      - targetNickname
      - reasonCode
      - severity
      - status
      - overdue
      - receivedAt
      - slaDueAt
      - reportCount
      properties:
        caseId:
          type: integer
          format: int64
          description: 신고 케이스 ID
          example: 907
        targetType:
          $ref: '#/components/schemas/ReportTargetType'
