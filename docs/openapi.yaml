        requestedAt:
          type: string
          format: date-time
        deleteScheduledAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
          nullable: true
          description: 아직 파기 전이면 `null`
        status:
          $ref: '#/components/schemas/MemberStatus'
    WithdrawalPageResponse:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - content
        properties:
          content:
            type: array
            items:
              $ref: '#/components/schemas/WithdrawalSummary'
    DevClockRequest:
      type: object
      description: >-
        `fixedAt`·`offsetMinutes`·`reset` 중 정확히 하나만 보냅니다. 둘 이상이면 어느 조작을
        의도했는지 알 수 없으므로 400 `VALIDATION_FAILED`입니다
      properties:
        fixedAt:
          type: string
          description: 이 시각으로 고정합니다. 오프셋 없는 LocalDateTime만 받습니다
            (`2026-09-15T00:00:00`) — `+09:00`을 붙이면 400입니다
          example: '2026-09-15T00:00:00'
        offsetMinutes:
          type: integer
          description: 가변 Clock에 더할 오프셋(분). 누적이 아니라 시스템 시각 기준 절대값입니다
          example: 1440
        reset:
          type: boolean
          description: '`true`면 시스템 시각으로 되돌립니다. `false`는 조작 명령이 아니라 400입니다'
    DevClockResponse:
      type: object
      description: 개발 전용. 공개 계약이 아닙니다
      required:
      - now
      - mode
      properties:
        now:
          type: string
          format: date-time
          description: 조작이 반영된 서버 현재 시각
        mode:
          type: string
          enum:
          - SYSTEM
          - FIXED
          - OFFSET
        offsetMinutes:
          type: integer
          format: int64
          nullable: true
          description: '`mode=OFFSET`일 때만 값이 있습니다'
      example:
        now: '2026-08-13T09:00:00+09:00'
        mode: OFFSET
        offsetMinutes: 1440
    DevSessionSeedResponse:
      type: object
      description: 개발 전용. 공개 계약이 아니고 게이트에서 눈으로 확인할 값만 담습니다
      required:
      - memberId
      - sessionIds
      - currentStreak
      - pointBalance
      properties:
        memberId:
          type: integer
          format: int64
        sessionIds:
          type: array
          items:
            type: integer
            format: int64
        currentStreak:
          type: integer
        pointBalance:
          type: integer
      example:
        memberId: 1042
        sessionIds:
        - 5601
        - 5602
        currentStreak: 2
        pointBalance: 1200
    DevBatchResponse:
      type: object
      description: 개발 전용. 공개 계약이 아닙니다
      required:
      - batch
      - processed
      properties:
        batch:
          $ref: '#/components/schemas/DevBatchName'
        processed:
          type: integer
          description: 처리 건수. 게이트에서 "정말 뭔가 바뀌었는지"를 확인하는 값입니다
      example:
        batch: B2
        processed: 2
    DevSessionSeedRequest:
      type: object
      required:
      - memberId
      - dates
      properties:
        memberId:
          type: integer
          format: int64
          example: 1042
        dates:
          type: array
          description: 이 일자들에 완주한 세션·참가 행·streak_day를 만듭니다
          items:
            type: string
            format: date
        targetMinutes:
          type: integer
          nullable: true
          minimum: 1
          default: 60
          description: 만들 세션의 목표 시간(분). 생략하면 60입니다.
            `morak.match.target-minutes-options`에 없는 값이면 400 `VALIDATION_FAILED`
      example:
        memberId: 1042
        dates:
        - '2026-08-08'
        - '2026-08-09'
        - '2026-08-10'
        targetMinutes: 120
  responses:
    Unauthorized:
      description: '인증 실패

        · `UNAUTHORIZED` 토큰이 없거나 잘못됨, 또는 이미 파기된 계정 → 로그인 화면으로

        · `TOKEN_EXPIRED` 토큰이 24시간을 넘김 → 로그인 화면으로

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GateForbidden:
      description: '게이트 차단

        · `WITHDRAWAL_PENDING` 탈퇴 신청 중인 계정 → 탈퇴 철회 안내

        · `MEMBER_SANCTIONED` 이용 제한된 계정 (`details: {"endsAt": ...}` — 영구 제재는 `{"endsAt": null}`)

        · `AGE_NOT_VERIFIED` 생년월일 미입력 → 생년월일 입력 화면으로

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GateForbiddenNoAge:
      description: '게이트 차단. 이 API는 연령 게이트를 적용하지 않습니다

        · `WITHDRAWAL_PENDING` 탈퇴 신청 중인 계정 → 탈퇴 철회 안내

        · `MEMBER_SANCTIONED` 이용 제한된 계정 (`details: {"endsAt": ...}` — 영구 제재는 `{"endsAt": null}`)

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AdminForbidden:
      description: "관리 권한 없음\n· `FORBIDDEN_ROLE` 관리자가 아닌 계정이 호출함 → **관리 탭 자체를 숨깁니다.**\n\
        \  일반 사용자 앱에서는 이 응답을 받을 일이 없어야 합니다.\n· `WITHDRAWAL_PENDING` 탈퇴 신청 중인 계정\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN_ROLE
              message: 관리자 권한이 필요합니다.
              details: null
    ValidationFailed:
      description: '`VALIDATION_FAILED` 요청 값이 형식·허용 범위에 맞지 않음 → 입력 오류 표시'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PageValidationFailed:
      description: '`VALIDATION_FAILED` 페이지 파라미터가 범위를 벗어남(`size` 최대 50)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidWebhookSignature:
      description: '`INVALID_WEBHOOK_SIGNATURE` 서명 검증 실패. 웹훅에서 non-2xx를 내는 유일한 경우입니다'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    DevEndpointNotFound:
      description: '`ENDPOINT_NOT_FOUND` 운영 프로필이라 이 엔드포인트가 등록되지 않음'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    LockAcquisitionFailed:
      description: '`LOCK_ACQUISITION_FAILED` 잠금 획득에 실패함 — 일시 경합이며 서버 상태를 바꾸지 않았습니다.
        1~2초 뒤 1회 재시도해도 안전합니다. 잠금을 잡는 모든 경로에서 날 수 있습니다
        (실측: MT-1·MT-3·AU-7·SS-4·SS-5·SS-6·SS-7)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      description: 라이브 세션 ID
      schema:
        type: integer
        format: int64
      example: 5501
    MatchRequestId:
      name: matchRequestId
      in: path
      required: true
      description: 매칭 요청 ID
      schema:
        type: integer
        format: int64
      example: 901
    EvictionId:
      name: evictionId
      in: path
      required: true
      description: 퇴출 기록 ID
      schema:
        type: integer
        format: int64
      example: 77
    ProductId:
      name: productId
      in: path
      required: true
      description: 상품 ID
      schema:
        type: integer
        format: int64
      example: 31
    OrderId:
      name: orderId
      in: path
      required: true
      description: 주문 ID
      schema:
        type: integer
        format: int64
      example: 612
    ChargeId:
      name: chargeId
      in: path
      required: true
      description: 포인트 충전 건 ID
      schema:
        type: integer
        format: int64
      example: 208
    CaseId:
      name: caseId
      in: path
      required: true
      description: 신고 케이스 ID
      schema:
        type: integer
        format: int64
      example: 1204
    AppealId:
      name: appealId
      in: path
      required: true
      description: 이의 신청 ID
      schema:
        type: integer
        format: int64
      example: 41
    MemberId:
      name: memberId
      in: path
      required: true
      description: 회원 ID
      schema:
        type: integer
        format: int64
      example: 1088
    BatchName:
      name: name
      in: path
      required: true
      description: 실행할 배치 이름
      schema:
        $ref: '#/components/schemas/DevBatchName'
    Page:
      name: page
      in: query
      required: false
      description: 조회할 페이지. 0부터 시작
      schema:
        type: integer
        default: 0
        minimum: 0
    Size:
      name: size
      in: query
      required: false
      description: 한 페이지 항목 수. 최대 50
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 50
paths:
  /auth/login:
    post:
      tags:
      - 로그인과 회원
      summary: AU-1 소셜 로그인·가입
      operationId: login
      description: "소셜 인가 코드로 로그인하거나 가입합니다. 별도 가입 폼 없이 약관 동의를 이 요청에 함께 싣습니다.\n\n- 응답의\
        \ `accessToken`은 이후 요청에 `Authorization: Bearer {accessToken}` 형식으로 담습니다.\n  **24시간\
        \ 유효하고 갱신(refresh) 토큰은 없습니다.**\n- `needsBirthdate`가 `true`면 **생년월일 입력 화면(AU-3)으로\
        \ 보내야 합니다.**\n  소셜에서 생년월일을 받아오면 그 자리에서 검증돼 `VERIFIED`로 옵니다.\n- 탈퇴 유예 중인 계정이\
        \ 로그인하면 탈퇴가 자동으로 철회되고 `loginResult`가 `RESTORED`로 옵니다.\n- 새로 가입하면 서버가 표시용 닉네임(`익명\
        \ {동물명}{2자리}`)을 만듭니다. 타인에게 보이는 화면에는 이 닉네임만 나옵니다.\n- 필수 약관은 TOS·PRIVACY 2종입니다.\
        \ MARKETING은 선택이며 미동의를 뜻하는 행을 따로 저장하지 않습니다.\n- **개발용 로그인도 이 엔드포인트를 씁니다.** `provider=DEV`로\
        \ 호출하면 `authorizationCode`가 그대로 식별자가 됩니다.\n  운영 프로필에서는 해당 클라이언트 빈이 없어 401 `INVALID_SOCIAL_TOKEN`으로\
        \ 떨어집니다.\n  관리자 계정은 어느 경로로도 만들 수 없고 DB 수동 변경으로만 만듭니다.\n"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: '요청 오류

            · `AGREEMENT_REQUIRED` 필수 약관 2종에 모두 동의하지 않음

            · `VALIDATION_FAILED` 입력 형식 오류

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '인증 실패

            · `INVALID_SOCIAL_TOKEN` 소셜 인증에 실패했거나, 소셜이 돌려준 식별자가 191자(member.provider_user_id
            길이)를 넘을 때 → 로그인 실패 안내 후 재시도. 식별자만은 절단하지 않고 거절합니다 —
            잘라 저장하면 앞부분이 같은 다른 계정과 한 회원으로 합쳐집니다

            · `UNAUTHORIZED` 탈퇴 유예가 끝나 파기 예정 시각을 넘긴 계정 → 되살리지 않고 새 계정으로 가입하도록 안내

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '가입 차단

            · `REJOIN_BLOCKED` 제재 이력 때문에 재가입이 막힌 계정 → 재가입 불가 안내

            · `UNDER_AGE_SIGNUP_BLOCKED` 소셜에서 받은 생년월일이 만 14세 미만 → 계정을 만들지 않습니다

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me:
    get:
      tags:
      - 로그인과 회원
      summary: AU-2 내 정보
      operationId: getMe
      description: "홈 화면 진입 시 필요한 회원 상태·포인트·목표·Streak를 한 번에 내려줍니다.\n\n- 이 API는 **제재\
        \ 중이거나 탈퇴 유예 중인 계정도 호출할 수 있습니다.** 상태를 화면에 안내하려면 이 API를 씁니다.\n- `memberStatus`가\
        \ `WITHDRAW_PENDING`이면 참여성 API가 403 `WITHDRAWAL_PENDING`으로 막힙니다.\n- `role`이 `ADMIN`일\
        \ 때만 관리 탭을 노출합니다.\n- 목표 미설정이면 `goal`이 `null`, 유효 제재가 없으면 `sanction`이 `null`입니다.\n"
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /members/me/birthdate:
    post:
      tags:
      - 로그인과 회원
      summary: AU-3 생년월일·연령 검증
      operationId: verifyAge
      description: "소셜에서 생년월일을 받지 못한 경우 수동 입력을 받아 연령을 검증합니다.\n\n- **만 14세 미만이면 계정을\
        \ 남기지 않습니다.** 약관 동의·웰컴 포인트까지 함께 지워지고, 발급된 토큰은 다음 요청부터 401이 됩니다.\n  입력 화면에\
        \ 이 점을 미리 안내해야 합니다.\n- 이미 `VERIFIED`인 계정이 다시 호출하면 409 `ALREADY_VERIFIED`입니다.\n\
        - 이 API가 연령 게이트를 해소하는 API라 자기 자신에게는 게이트를 적용하지 않습니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BirthDateRequest'
      responses:
        '200':
          description: 검증 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgeVerificationResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `UNDER_AGE_SIGNUP_BLOCKED` 만 14세 미만 → 계정이 파기됩니다

            · `WITHDRAWAL_PENDING` 탈퇴 신청 중인 계정

            · `MEMBER_SANCTIONED` 이용 제한된 계정

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error:
                  code: UNDER_AGE_SIGNUP_BLOCKED
                  message: 만 14세 미만은 가입할 수 없습니다.
                  details: null
        '409':
          description: '`ALREADY_VERIFIED` 이미 연령 검증이 끝난 계정'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me/withdrawal:
    post:
      tags:
      - 로그인과 회원
      summary: AU-4 탈퇴 신청
      operationId: withdraw
      description: "30일 유예 후 자동 파기되는 탈퇴를 신청합니다. 요청 본문은 없습니다.\n\n- 신청 즉시 대기 중인 매칭\
        \ 요청이 취소되고, 진행 중이던 세션에서는 자동으로 퇴장 처리됩니다.\n- 유예 기간 안에 재로그인하거나 AU-5로 철회하면 계정이\
        \ 되살아납니다. 취소된 매칭과 퇴장한 세션은 복구되지 않습니다.\n- **제재 중에도 탈퇴는 막지 않습니다.**\n"
      responses:
        '202':
          description: 탈퇴 신청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`WITHDRAWAL_PENDING` 이미 탈퇴 유예 중인 계정 → 철회 안내'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
    delete:
      tags:
      - 로그인과 회원
      summary: AU-5 탈퇴 철회
      operationId: cancelWithdrawal
      description: "탈퇴 신청을 철회하고 계정을 되살립니다.\n\n- **제재 중에도 철회를 막지 않습니다.** 막으면 계정 복구가\
        \ 영구히 불가능해집니다.\n- 취소된 매칭 요청과 퇴장한 세션은 복구하지 않습니다.\n"
      responses:
        '204':
          description: 철회 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: '`NOT_WITHDRAWING` 탈퇴 유예 상태가 아님'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me/media-consent:
    post:
      tags:
      - 로그인과 회원
      summary: AU-6 캠 영상 온디바이스 분석 동의
      operationId: agreeMediaConsent
      description: "라이브 세션 진입 전 캠 영상 처리 방식에 동의를 받습니다.\n\n동의 문구는 고정입니다 — \"라이브 세션 중\
        \ 웹캠 영상은 내 기기에서만 분석되며, 서버로 전송하거나 저장하지 않습니다.\n서버에는 자리비움 여부와 시각만 기록됩니다.\"\n\n\
        - `agreed=false`는 400입니다. 미동의를 저장하지 않습니다(동의 철회는 v1 범위 밖).\n- 미동의 상태에서는 SS-2\
        \ 접속 토큰 발급이 403 `CONSENT_REQUIRED`로 막힙니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaConsentRequest'
      responses:
        '204':
          description: 동의 저장 완료
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbiddenNoAge'
  /members/me/goal:
    put:
      tags:
      - 로그인과 회원
      summary: AU-7 목표 기간 설정
      operationId: setGoal
      description: "마이페이지에서 개인 목표 챌린지 기간을 설정합니다. 매칭 조건이 아니라 Streak 달성 판정의 기준입니다.\n\
        \n- 허용값은 7·14·30일입니다.\n- 진행 중(`ACTIVE`) 목표가 있으면 409 `GOAL_ALREADY_ACTIVE`입니다.\
        \ 달성(`ACHIEVED`) 상태에서는 재도전으로 새로 설정할 수 있습니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalRequest'
      responses:
        '200':
          description: 목표 설정 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalResponse'
              example:
                goalId: 88
                periodDays: 14
                startedOn: '2026-08-12'
                progressDays: 0
                status: ACTIVE
                achievedAt: null
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '409':
          description: '`GOAL_ALREADY_ACTIVE` 진행 중인 목표가 있음'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /match-requests:
    post:
      tags:
      - 매칭
      summary: MT-1 매칭 요청
      operationId: createMatchRequest
      description: "하루 목표 시간만 골라 6인 자동 매칭 대기열에 등록합니다. 6인이 차면 그 자리에서 라이브 세션이 생성됩니다.\n\
        \n- 허용값은 60·120·180·240분 4종입니다. 대기열이 이 값으로 갈립니다.\n- 응답의 `status`가 `WAITING`이면\
        \ 대기 화면으로, `MATCHED`면 `sessionId`를 들고 세션 화면으로 넘어갑니다.\n- 대기는 10분 뒤 만료됩니다(`expiresAt`). 만료 판정은 배치가 매분 하므로 최대 1분간 `WAITING`이\
        \ 유지되고, 그 창의 성사는 계약입니다 — 후보 조회는 `expires_at`을 보지 않습니다.\n\
        - 신고로 차단된 상대와는 같은 세션에 묶이지 않습니다.\n- 퇴출된 뒤 30분 동안은 재매칭이 막힙니다. 이때 `details`에\
        \ 재시도 가능 시각이 담깁니다.\n"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequestCreate'
      responses:
        '201':
          description: 대기 등록 또는 매칭 성사
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRequestResponse'
              examples:
                waiting:
                  summary: 대기
                  value:
                    matchRequestId: 901
                    status: WAITING
                    targetMinutes: 120
                    requestedAt: '2026-08-12T09:00:00+09:00'
                    expiresAt: '2026-08-12T09:10:00+09:00'
                    waitingCount: 4
                    requiredCount: 6
                    sessionId: null
                matched:
                  summary: 성사
                  value:
                    matchRequestId: 901
                    status: MATCHED
                    targetMinutes: 120
                    requestedAt: '2026-08-12T09:00:00+09:00'
                    expiresAt: '2026-08-12T09:10:00+09:00'
                    waitingCount: 6
                    requiredCount: 6
                    sessionId: 5501
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '409':
          description: '요청할 수 없는 상태

            · `DUPLICATE_MATCH_REQUEST` 이미 대기 중인 요청이 있음

            · `ALREADY_IN_ACTIVE_SESSION` 진행 중인 세션에 참가 중 (`details.sessionId`에 그 세션 번호 —
            앱 재시작 후의 재매칭 시도가 이 오류의 대표 경우라, 번호로 그 세션에 바로 복귀합니다)

            · `REMATCH_COOLDOWN` 퇴출 후 30분이 지나지 않음 (`details.availableAt`)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /match-requests/me:
    get:
      tags:
      - 매칭
      summary: MT-2 매칭 상태 폴링
      operationId: getMyMatchRequest
      description: "대기 화면이 주기적으로 호출해 매칭 성사를 확인합니다. 푸시 알림은 v1에 없습니다.\n\n\
        **가장 최근 요청을 상태와 무관하게 반환합니다.** 404는 요청 이력이 전무한 경우뿐입니다.\n\n\
        상태별 화면 행동:\n\
        - `WAITING` — 폴링을 계속합니다. `expiresAt`이 지났어도 `EXPIRED`를 받을 때까지 유지합니다\
        (만료 창의 성사는 계약입니다 — 후보 조회는 `expires_at`을 보지 않습니다)\n\
        - `MATCHED` — `sessionId`로 전이하고 폴링을 멈춥니다\n\
        - `CANCELLED` — 대기 화면을 닫고 재요청 버튼을 그립니다(본인 취소 또는 탈퇴·제재 회수)\n\
        - `EXPIRED` — 재시도 안내를 띄웁니다\n\n\
        `requiredCount`는 매칭 확정 인원이며 `waitingCount`가 여기 도달하면 성사됩니다.\n"
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchRequestResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/GateForbidden'
        '404':
          description: '`NO_ACTIVE_MATCH_REQUEST` 요청 이력이 전무함 — 대기 화면 자체가 성립하지 않으므로 닫습니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /match-requests/{matchRequestId}:
    delete:
      tags:
      - 매칭
      summary: MT-3 매칭 취소
      operationId: cancelMatchRequest
      description: "대기 중 조건을 바꾸거나 그만두기 위해 대기를 취소합니다. 조건 변경 플로우가 여기에 걸립니다.\n\n- 이미\
        \ 성사된 요청은 취소할 수 없습니다(409 `ALREADY_MATCHED`).\n- 이미 취소·만료된 요청의 재취소는 204로 흘립니다(멱등).\n"
      parameters:
      - $ref: '#/components/parameters/MatchRequestId'
      responses:
        '204':
          description: 취소 완료
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `FORBIDDEN` 타인의 매칭 요청

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`NO_ACTIVE_MATCH_REQUEST` 없는 요청 id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`ALREADY_MATCHED` 이미 성사된 요청'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /sessions/{sessionId}:
    get:
      tags:
      - 라이브 세션
      summary: SS-1 세션 상세
      operationId: getSession
      description: "라이브 화면이 참가자 목록과 진행 상태를 그립니다.\n\n- `participants`에는 퇴장·퇴출된 참가자도\
        \ 포함됩니다. 상태를 병기하므로 자리 수 변화가 화면에 드러납니다.\n- 실명·SNS 값은 어떤 경우에도 내려가지 않습니다.\n\
        - `joinedAt`이 `null`이면 매칭은 됐지만 아직 룸에 들어오지 않은 참가자입니다.\n  값은 입장 웹훅이 최초 1회만 채우므로\
        \ 재접속을 반복해도 최초 입장 시각이 유지됩니다.\n- `endReason`은 진행 중이면 `null`, 종료 후에는 `NORMAL`\
        \ 또는 `EARLY_UNDER_MIN`입니다.\n- 참가 이력이 있어야 조회할 수 있습니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 이 세션 참가 이력이 없음

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/token:
    post:
      tags:
      - 라이브 세션
      summary: SS-2 LiveKit 접속 토큰 발급
      operationId: issueSessionToken
      description: "룸에 접속할 단기 토큰을 받습니다. 요청 본문은 없습니다. 서버는 토큰만 발급하고 미디어는 경유하지 않습니다.\n\
        \n- **마이크는 서버가 막습니다.** 토큰 grant에서 오디오 publish 권한을 빼기 때문에 v1에는 언뮤트 수단이 없습니다.\n\
        \  `canPublishAudio`는 항상 `false`이며 클라이언트는 이 값을 보고 마이크 버튼을 비활성으로 그립니다.\n- `identity`는\
        \ `memberId`의 문자열 표현입니다. 입퇴장 웹훅이 이 규약에 의존하므로 바꾸면 양쪽이 함께 깨집니다.\n- 캠 영상 분석 동의(AU-6)가\
        \ 없으면 403 `CONSENT_REQUIRED`입니다.\n- 토큰 발급 자체는 상태를 바꾸지 않습니다. 실제 입장은 웹훅으로 기록됩니다.\n\
        \  6인 동율 그리드는 클라이언트 책임입니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 발급 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivekitTokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아니거나 이미 퇴장한 참가자 — `LEFT` 본인도 이 코드입니다.
            "참가자가 아닙니다"를 그대로 띄우지 말고, 문구를 가르려면 SS-1 본인 행의 `status`를 보세요

            · `CONSENT_REQUIRED` 캠 영상 온디바이스 분석에 동의하지 않음 → 동의 화면으로

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '요청할 수 없는 상태

            · `SESSION_ENDED` 이미 종료된 세션

            · `ALREADY_EVICTED` 퇴출된 참가자 → 이의 신청(AP-1) 안내

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/goal:
    put:
      tags:
      - 라이브 세션
      summary: SS-3 오늘 할 일 등록
      operationId: setSessionGoal
      description: "세션 진입 시 한 줄 목표를 입력받아 본인 화면 하단에 노출합니다. 세션 중 수정할 수 있습니다.\n\n-\
        \ 최대 50자입니다. 초과·빈 문자열은 400입니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionGoalRequest'
      responses:
        '200':
          description: 등록 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionGoalResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아님

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`SESSION_ENDED` 이미 종료된 세션 · `ALREADY_EVICTED` 퇴출된 참가자(SS-2와 동일 취급)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /sessions/{sessionId}/absence-events:
    post:
      tags:
      - 라이브 세션
      summary: SS-4 자리비움 이벤트 보고
      operationId: reportAbsenceEvent
      description: "온디바이스 AI가 **자기 자신의** 얼굴 미검출 시작·종료만 보고합니다. 경고 부여와 퇴출 판정은 서버가 계산합니다.\n\
        \n- 타인에 대한 판정은 보낼 수 없습니다. 회원 식별은 요청 본문이 아니라 토큰에서 합니다.\n- `clientSeq`가 재전송을\
        \ 흡수합니다. 같은 값이 다시 오면 409 `DUPLICATE_ABSENCE_EVENT`이며,\n  서버 상태는 바뀌지 않으므로 클라이언트는\
        \ 정상 종료로 취급하면 됩니다.\n- 직전 이벤트로부터 너무 짧은 간격으로 다시 보내면 429 `ABSENCE_RATE_LIMITED`입니다.\n\
        \  정상 클라이언트는 얼굴 검출 상태가 바뀔 때만 보내므로 초당 여러 건이 올 이유가 없습니다.\n- `END`를 받으면 직전 `START`와\
        \ 짝을 지어 지속시간을 계산하고, 임계를 넘긴 구간은 길이에 비례해 경고가 1회 이상 붙습니다(1\
        \ + floor((지속초 − 임계 − 1) / escalation)).\n  한 번의 보고로 `warningCount`가 2 이상\
        \ 오를 수 있습니다.\n  경고가 3회에 도달하면 그 자리에서 퇴출되고 응답의\
        \ `evicted`가 `true`, `evictionId`가 채워집니다.\n- **이 API는 캠이 연결된 상태의 자리비움만 다룹니다.**\
        \ 연결 자체가 끊긴 경우는 입퇴장 웹훅이 별개 축으로 처리하며 경고를 만들지 않습니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AbsenceEventRequest'
      responses:
        '200':
          description: 접수 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AbsenceEventResponse'
              examples:
                warned:
                  summary: 경고 부여
                  value:
                    accepted: true
                    warningCount: 2
                    evicted: false
                    evictionId: null
                    pointDelta: 0
                    closedAbsenceSeconds: 65
                evicted:
                  summary: 퇴출
                  value:
                    accepted: true
                    warningCount: 3
                    evicted: true
                    evictionId: 77
                    pointDelta: -300
                    closedAbsenceSeconds: 81
        '400':
          description: >-
            `VALIDATION_FAILED` `occurredAt`이 허용 범위를 벗어남. 허용 범위는
            [세션 시작 −5초, 현재 +5초]이며, ±5초는 단말이 초 단위로 자른 시각을 보내는 것을 흡수하기 위한 폭입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아님

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '요청할 수 없는 상태

            · `DUPLICATE_ABSENCE_EVENT` 같은 `clientSeq` 재수신 → 정상 종료로 취급

            · `ALREADY_EVICTED` 이미 퇴출된 참가자

            · `SESSION_ENDED` 이미 종료된 세션

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`ABSENCE_RATE_LIMITED` 이벤트 보고 간격이 너무 짧음.
            버리지 말고 **같은 `clientSeq`로 5초 뒤 재전송**해야 합니다 — 새 번호를 매기면 멱등키가 다른 이벤트로 취급해
            재전송 중복 제거가 깨집니다. 특히 `END`가 유실되면 짝 없는 `START`가 되어 세션 종료 시각까지 자리비움으로 정산됩니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /sessions/{sessionId}/pause:
    post:
      tags:
      - 라이브 세션
      summary: SS-5 화장실 모드 시작
      operationId: startPause
      description: "세션당 1회, 정해진 시간 동안 카메라 송출을 중단합니다. 요청 본문은 없습니다.\n\n- PAUSED 구간은\
        \ 자리비움 판정 대상에서 제외되고, 재실로 인정되므로 완주 판정에 영향을 주지 않습니다.\n- 이미 한 번 썼으면 409 `PAUSE_ALREADY_USED`입니다.\
        \ 복귀해도 사용 이력은 남습니다.\n- **진행 중이던 자리비움 구간이 있으면 Pause를 시작하기 전에 먼저 닫습니다.**\
        \ 자리를 비운 채\n  화장실 모드를 눌러 판정을 피해 가는 경로를 막기 위해서입니다. 닫힌 구간이 임계를 넘겼으면\
        \ 그 자리에서 길이에 비례해 경고가 1회 이상 붙고(1 + floor((지속초 − 임계 − 1) / escalation)),\n\
        \  한 번의 마감으로 `warningCount`가 2 이상 오를 수 있습니다.\n  그 경고가 3회째에 닿으면 Pause가\
        \ 시작되지 않은 채 퇴출되어 409 `ALREADY_EVICTED`가\
        \ 됩니다.\n  응답의 `warningIssued`·`warningCount`·`closedAbsenceSeconds`가 이 처리의 결과입니다.\n\
        - 대체 일러스트 전환은 클라이언트 책임입니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 시작됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseStartResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아니거나 이미 퇴장함

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '요청할 수 없는 상태

            · `PAUSE_ALREADY_USED` 이번 세션에서 이미 사용함

            · `ALREADY_EVICTED` 이미 퇴출된 참가자

            · `SESSION_ENDED` 이미 종료된 세션

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
    delete:
      tags:
      - 라이브 세션
      summary: SS-6 화장실 모드 복귀
      operationId: endPause
      description: "카메라 송출을 재개합니다. 요청 본문은 없습니다.\n\n- 상한을 넘겨 복귀하면 서버가 경고 1회를 부여하고 Pause를\
        \ 강제 종료합니다(`warningIssued=true`).\n  그 경고가 3회째면 그대로 퇴출됩니다.\n- 복귀를 호출하지 않은 채\
        \ 세션이 끝나면 종료 배치가 같은 규칙으로 정산합니다.\n- Pause 상태가 아닐 때 호출하면 409 `PAUSE_NOT_ACTIVE`입니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 복귀 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PauseEndResponse'
              examples:
                normal:
                  summary: 정상 복귀
                  value:
                    status: ACTIVE
                    elapsedSeconds: 420
                    warningIssued: false
                    warningCount: 1
                    evicted: false
                overdue:
                  summary: 초과 복귀
                  value:
                    status: ACTIVE
                    elapsedSeconds: 730
                    warningIssued: true
                    warningCount: 2
                    evicted: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아님

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '요청할 수 없는 상태

            · `PAUSE_NOT_ACTIVE` 화장실 모드가 아님

            · `SESSION_ENDED` 이미 종료된 세션

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /sessions/{sessionId}/participation:
    delete:
      tags:
      - 라이브 세션
      summary: SS-7 자율 퇴장
      operationId: leaveSession
      description: "사정이 생겼을 때 사유를 남기고 세션에서 나갑니다.\n\n- 사유는 PERSONAL·DEVICE_ISSUE·UNPLEASANT·ETC\
        \ 중 하나입니다.\n  서버 전용 사유(WITHDRAWAL·SANCTION)를 보내면 400입니다.\n- 포인트 차감은 없지만 그\
        \ 세션은 미완주 처리됩니다. **재입장은 불가하고 공석 충원도 없습니다.**\n- 남은 인원이 최소 인원 미만이 되면 세션이 조기\
        \ 종료됩니다. 이때 그 시점의 잔류자는 완주로 인정됩니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        description: 본문을 빼거나 `reason`을 비워도 바인딩에서 거절하지 않고 400 `REASON_REQUIRED`로 답합니다
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeaveSessionRequest'
      responses:
        '204':
          description: 퇴장 완료
        '400':
          description: '요청 오류

            · `REASON_REQUIRED` 본문이 아예 없거나 `reason`이 비어 있음

            · `VALIDATION_FAILED` 허용되지 않는 사유값(서버 전용 사유 포함)

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 참가자가 아님

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '요청할 수 없는 상태

            · `ALREADY_LEFT` 이미 퇴장함

            · `ALREADY_EVICTED` 퇴출된 참가자(SS-2·SS-3과 동일 취급)

            · `SESSION_ENDED` 이미 종료된 세션

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/LockAcquisitionFailed'
  /sessions/{sessionId}/result:
    get:
      tags:
      - 라이브 세션
      summary: SS-8 세션 결과
      operationId: getSessionResult
      description: "세션 종료 후 본인 완주 여부와 지급 결과를 보여줍니다. 읽기 전용이며 지급은 종료 배치가 이미 끝냈습니다.\n\
        \n- `pointAwarded`는 `targetMinutes` 기준입니다. 조기 종료로 일찍 끝났어도 줄어들지 않습니다.\n  세션이\
        \ 일찍 끝난 것은 남은 사람의 책임이 아니기 때문입니다.\n- `streak.countedToday=false`는 같은 날 이미 다른\
        \ 세션으로 완주가 기록돼 Streak가 중복 증가하지 않았다는 뜻입니다.\n- `participantStatus=LEFT`이고 `leftReason=DEVICE_ISSUE`인데\
        \ 본인이 퇴장을 누른 적이 없다면,\n  연결이 유예 시간을 넘겨 끊겨 서버가 자동 처리한 경우입니다. 이때도 경고나 포인트 차감은\
        \ 없습니다.\n- 목표 달성이 함께 일어나면 `goalAchieved=true`, `badgeCode=GOAL_ACHIEVED`가 되고\
        \ 원장에 별도 적립이 쌓입니다.\n- 진행 중인 세션에 호출하면 409 `SESSION_NOT_ENDED`입니다.\n\
        - **종료 예정 시각(`endsAt`)이 지나도 곧바로 결과가 나오지는 않습니다.** 정산은 매분 :00에 도는 종료 배치가\
        \ 하므로\n  세션은 최대 1분간 `LIVE`로 남고 그동안 이 API는 409 `SESSION_NOT_ENDED`를 돌려줍니다.\n\
        \  오류가 아니라 아직 정산 전이라는 뜻이므로 실패 화면을 띄우지 말고 몇 초 간격으로 다시 부르면 됩니다.\n- `CANCELLED`\
        \ 세션도 정산 결과가 없어 같은 409 `SESSION_NOT_ENDED`입니다.\n"
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResultResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '차단

            · `NOT_SESSION_PARTICIPANT` 이 세션 참가 이력이 없음

            · `WITHDRAWAL_PENDING` / `MEMBER_SANCTIONED` / `AGE_NOT_VERIFIED` 게이트 차단

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`SESSION_NOT_FOUND` 존재하지 않는 세션'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: '`SESSION_NOT_ENDED` 아직 정산되지 않은 세션.

            종료 예정 시각이 지난 직후에도 최대 1분간은 이 응답이 옵니다 — 종료 배치가 매분 :00에 돌기 때문입니다.
            실패로 처리하지 말고 몇 초 간격으로 재시도하세요. `CANCELLED` 세션도 같은 응답입니다

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /members/me/sessions:
    get:
      tags:
      - 라이브 세션
      summary: SS-9 내 세션 이력
      operationId: getMySessions
      description: "내가 참가한 세션 이력을 페이지로 조회합니다.\n\n- **이 API는 연령 게이트를 적용하지 않습니다.** 본인\
        \ 상태 확인은 막지 않습니다. 참여 자체는 매칭 요청에서 이미 막힙니다.\n"
      parameters:
      - name: status
        in: query
        required: false
        description: 세션 상태(`LIVE`·`ENDED`) 필터. 생략하면 전체 — 참가자 상태(`participantStatus`) 필터가 아닙니다
        schema:
          $ref: '#/components/schemas/SessionStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MySessionPageResponse'
        '400':
          $ref: '#/components/responses/PageValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
