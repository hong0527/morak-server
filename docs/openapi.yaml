      type: string
      description: '리포트 격자에 표시되는 일자별 인증 상태.

        `NONE`은 그 날 인정된 인증이 없다는 뜻입니다. 본인 행에는 처리 중 상태도 나올 수 있습니다.

        (공통 `ProofAiStatus`에 `NONE`이 없어 리포트 전용으로 따로 둡니다.)

        '
      enum:
      - APPROVED
      - NONE
      - SCREENING
      - PENDING_REVIEW
      - HOLD
      - BLOCKED
      example: APPROVED
    ReportPersonal:
      type: object
      description: 내 완주 집계
      required:
      - provedDays
      - totalDays
      - proofRate
      - criteriaMet
      properties:
        provedDays:
          type: integer
          description: 내가 인증한 날 수
          example: 86
        totalDays:
          type: integer
          description: 챌린지 전체 일수
          example: 100
        proofRate:
          type: number
          format: double
          description: 내 인증률. `provedDays ÷ totalDays`. 0.0 ~ 1.0
          example: 0.86
        criteriaMet:
          type: boolean
          description: 개인 기준(`criteria.personalProofRate`) 충족 여부
          example: true
      example:
        provedDays: 86
        totalDays: 100
        proofRate: 0.86
        criteriaMet: true
