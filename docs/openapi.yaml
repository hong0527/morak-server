# 생성 기준: api-spec.md v2.0 (2026-08-12). 수정은 api-spec.md를 먼저 고치고 재생성한다.
openapi: 3.0.3
info:
  title: MoLock API
  version: 2.0.0
  description: '6인 랜덤 매칭 라이브 캠스터디 서비스 MoLock의 백엔드 API입니다. 구 모락(사진 인증 챌린지)에서 라이브 세션으로 피벗했습니다.


    시간만 고르면 같은 목표 시간의 6명이 자동으로 묶여 라이브 세션이 열리고,

    세션이 끝날 때까지 자리를 지키면 완주로 인정돼 포인트와 Streak가 쌓입니다.

    캠 영상은 서버로 오지 않고 각자 기기에서만 분석되며, 서버는 자리비움 여부와 시각만 받습니다.


    ## 인증


    로그인으로 받은 토큰을 `Authorization: Bearer {accessToken}` 헤더에 넣어 보냅니다.

    토큰은 24시간 유효하며 갱신(refresh) 토큰은 없습니다. 만료되면 다시 로그인해야 합니다.


    ## 오류 응답


    모든 실패 응답은 아래 형태로 통일되어 있습니다.


    ```json

    {"error": {"code": "SESSION_NOT_FOUND", "message": "존재하지 않는 세션입니다.", "details": null}}

    ```


    화면 분기는 `message`가 아니라 **`code`** 로 하세요. 문구는 다듬어질 수 있지만 코드는 바뀌지 않습니다.

    에러 코드 하나에는 HTTP status 하나만 대응합니다. 같은 코드가 상황에 따라 다른 status로 오지 않습니다.


    ## 어느 API에서나 날 수 있는 오류


    아래 네 가지는 모든 경로에 해당하므로 개별 API 설명에서는 생략했습니다.


    | 상태 | 코드 | 언제 | 화면 처리 |

    | --- | --- | --- | --- |

    | 404 | `ENDPOINT_NOT_FOUND` | 없는 주소를 호출했을 때 | 개발 중 오류. 경로를 확인하세요 |

    | 405 | `METHOD_NOT_ALLOWED` | 주소는 맞지만 HTTP 메서드가 다를 때 | 개발 중 오류. 메서드를 확인하세요 |

    | 415 | `UNSUPPORTED_MEDIA_TYPE` | 본문이 있는 요청에 `Content-Type: application/json`을 빠뜨렸을 때
    | 개발 중 오류. 요청 헤더를 확인하세요 |

    | 500 | `INTERNAL_SERVER_ERROR` | 서버 오류 | 잠시 후 다시 시도하도록 안내 |


    인증·회원상태·제재·연령 게이트의 401·403은 각 API의 응답 설명에 적혀 있습니다.


    ## 목록 응답


    목록은 `{content[], page, size, totalElements, totalPages}` 형태입니다.

    `page`는 0부터, `size`는 기본 20·최대 50이며 초과하면 400 `VALIDATION_FAILED`입니다.


    ## 시각 표기


    모든 시각은 ISO-8601(`+09:00`), 일자는 `YYYY-MM-DD`입니다.

    시각은 항상 초 단위이고 소수점 이하는 잘라서 내려갑니다(`yyyy-MM-dd''T''HH:mm:ssXXX`).

    폭이 고정이라 고정 패턴으로 파싱해도 됩니다.

    '
servers:
- url: http://localhost:8080/api
  description: 개발
- url: https://api.molock.example.com/api
  description: 운영 (배포 시 확정)
tags:
- name: 로그인과 회원
  description: 소셜 로그인, 내 정보, 연령 확인, 캠 분석 동의, 목표 기간, 탈퇴
- name: 매칭
  description: 목표 시간을 골라 6인 세션에 배정받기
- name: 라이브 세션
  description: 세션 조회, 접속 토큰, 자리비움 보고, 화장실 모드, 퇴장, 결과
- name: 이의 신청
  description: AI 3회 경고 퇴출에 대한 운영진 2차 개입 요청
- name: 포인트
  description: 잔액과 적립·차감 내역
- name: 스토어
  description: 포인트로 교환하는 기프티콘·제휴 서적
- name: 결제
  description: 포인트 충전(웹 PG)
- name: 신고
  description: 불쾌한 사용자·세션 신고와 재매칭 차단
- name: 관리자
  description: 운영자 전용. 일반 사용자 앱에서는 호출하지 않습니다
- name: 개발 전용
  description: '`@Profile("dev")` AND `morak.dev.enabled=true`일 때만 등록됩니다. 운영 프로필에서는 404입니다'
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 응답의 `accessToken`을 넣습니다. 24시간 유효합니다.
  schemas:
    ErrorResponse:
      type: object
      description: 모든 실패 응답의 공통 형태
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - details
          properties:
            code:
              type: string
              description: 화면 분기에 쓰는 값
              example: SESSION_NOT_FOUND
            message:
              type: string
              description: 사용자에게 그대로 보여줘도 되는 문구
              example: 존재하지 않는 세션입니다.
            details:
              type: object
              nullable: true
              additionalProperties: true
              description: '추가 정보. 담을 내용이 없어도 키는 항상 실리며 값이 `null`입니다.

                `VALIDATION_FAILED`는 필드명을 키로 하는 평평한 `{필드명: 메시지}` 맵을 담습니다 —
                중첩되지 않으므로 그대로 입력란에 붙일 수 있습니다.

                `MEMBER_SANCTIONED`처럼 코드마다 고유한 모양을 쓰는 경우는 각 API 응답 설명에 적혀 있습니다.

                '
              example:
                periodDays: 허용값은 7, 14, 30입니다.
    PageMeta:
      type: object
      description: 목록 응답의 공통 페이지 정보
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          description: 현재 페이지. 0부터 시작
          example: 0
        size:
          type: integer
          description: 한 페이지 항목 수
          example: 20
        totalElements:
          type: integer
          description: 전체 항목 수
          example: 37
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 2
    MemberRole:
      type: string
      description: 회원 역할. PARTICIPANT 일반 참가자 · ADMIN 운영자(관리 탭 노출)
      enum:
      - PARTICIPANT
      - ADMIN
      example: PARTICIPANT
    MemberStatus:
      type: string
      description: '회원 상태. ACTIVE 정상 · WITHDRAW_PENDING 탈퇴 유예 중(참여 API 차단) · DELETED 파기 완료'
      enum:
      - ACTIVE
      - WITHDRAW_PENDING
      - DELETED
      example: ACTIVE
    AgeVerification:
      type: string
      description: '연령 검증 상태. REQUIRED 생년월일 미입력 · VERIFIED 만 14세 이상 확인됨.

        만 14세 미만은 계정을 만들지 않으므로 미성년 상태로 저장되는 값이 없습니다.

        '
      enum:
      - REQUIRED
      - VERIFIED
      example: VERIFIED
    SocialProvider:
      type: string
      description: '소셜 로그인 제공자. DEV는 개발 프로필 전용이며 별도 로그인 엔드포인트는 없습니다'
      enum:
      - KAKAO
      - NAVER
      - GOOGLE
      - APPLE
      - DEV
      example: KAKAO
    AgreementType:
      type: string
      description: '약관 종류. TOS·PRIVACY는 필수, MARKETING은 선택'
      enum:
      - TOS
      - PRIVACY
      - MARKETING
      example: TOS
    LoginResult:
      type: string
      description: '로그인 처리 결과. NORMAL 일반 로그인 · RESTORED 탈퇴 대기 중이던 계정이 자동으로 되살아남'
      enum:
      - NORMAL
      - RESTORED
      example: NORMAL
    GoalStatus:
      type: string
      description: '개인 목표 상태. ACTIVE 진행 중 · ACHIEVED 달성 · CANCELLED 재설정·탈퇴로 취소'
      enum:
      - ACTIVE
      - ACHIEVED
      - CANCELLED
      example: ACTIVE
    MatchRequestStatus:
      type: string
      description: '매칭 요청 상태. WAITING 대기 · MATCHED 성사 · CANCELLED 취소 · EXPIRED 10분 만료'
      enum:
      - WAITING
      - MATCHED
      - CANCELLED
      - EXPIRED
      example: WAITING
    MatchEventType:
      type: string
      description: 매칭 이벤트 기록 종류. 서버 내부 기록용이며 응답에 직접 실리지 않습니다
      enum:
      - MATCH_COMPLETED
      - WAIT_CANCELLED
      - WAIT_EXPIRED
      example: MATCH_COMPLETED
    SessionStatus:
      type: string
      description: '세션 상태. LIVE 진행 중 · ENDED 종료 · CANCELLED(v1에 전이 경로 없음)'
      enum:
      - LIVE
      - ENDED
      - CANCELLED
      example: LIVE
    SessionEndReason:
      type: string
      description: '세션 종료 사유. 진행 중에는 `null`. NORMAL 예정 시각 도래 · EARLY_UNDER_MIN 잔여 인원 미달 조기 종료'
      enum:
      - NORMAL
      - EARLY_UNDER_MIN
      example: NORMAL
    ParticipantStatus:
      type: string
      description: '참가자 상태. ACTIVE 참여 중 · PAUSED 화장실 모드 · LEFT 퇴장 · EVICTED 경고 3회 퇴출'
      enum:
      - ACTIVE
      - PAUSED
      - LEFT
      - EVICTED
      example: ACTIVE
    LeftReason:
      type: string
      description: '퇴장 사유. WITHDRAWAL(탈퇴)·SANCTION(제재)은 서버 전용이며 요청으로 받지 않습니다.

        퇴출은 이 값이 아니라 ParticipantStatus=EVICTED로 표현합니다.

        '
      enum:
      - PERSONAL
      - DEVICE_ISSUE
      - UNPLEASANT
      - ETC
      - WITHDRAWAL
      - SANCTION
      example: DEVICE_ISSUE
    LeaveReason:
      type: string
      description: '자율 퇴장(SS-7) 요청에서 받는 사유. 서버 전용 사유 WITHDRAWAL·SANCTION은 여기 들어올 수 없습니다'
      enum:
      - PERSONAL
      - DEVICE_ISSUE
      - UNPLEASANT
      - ETC
      example: DEVICE_ISSUE
    AbsenceEventType:
      type: string
      description: '자리비움 이벤트 종류. START 얼굴 미검출 시작 · END 재검출'
      enum:
      - START
      - END
      example: START
    StickerType:
      type: string
      description: '응원 스티커 종류. CLAP 파이팅 · MUSCLE 힘내요 · FIRE 열공'
      enum:
      - CLAP
      - MUSCLE
      - FIRE
      example: CLAP
    PointReason:
      type: string
      description: 포인트 증감 사유
      enum:
      - WELCOME
      - SESSION_COMPLETE
      - GOAL_ACHIEVED
      - EVICTION_PENALTY
      - ORDER_SPEND
      - ORDER_CANCEL
      - CHARGE
      - APPEAL_REFUND
      example: SESSION_COMPLETE
    ProductType:
      type: string
      description: '상품 종류. GIFTICON 기프티콘 · BOOK 제휴 서적'
      enum:
      - GIFTICON
      - BOOK
      example: GIFTICON
    ProductStatus:
      type: string
      description: '상품 상태. ON_SALE 판매 중 · SOLD_OUT 품절 · HIDDEN 목록·상세에서 감춤'
      enum:
      - ON_SALE
      - SOLD_OUT
      - HIDDEN
      example: ON_SALE
    OrderStatus:
      type: string
      description: '주문 상태. ORDERED 접수. CANCELLED는 v1에 전이 경로가 없습니다'
      enum:
      - ORDERED
      - CANCELLED
      example: ORDERED
    ChargeStatus:
      type: string
      description: '충전 상태. READY 결제창 대기 · APPROVED 승인·적립 완료 · FAILED 실패'
      enum:
      - READY
      - APPROVED
      - FAILED
      example: READY
    AppealStatus:
      type: string
      description: '이의 신청 상태. PENDING 접수 · ACCEPTED 인용 · REJECTED 기각 · CLOSED 심사 불가 종결(신청자 계정 파기로 심사 근거가 사라진 경우. 관리자가 지정할 수 없고 파기 배치만 기록한다)'
      enum:
      - PENDING
      - ACCEPTED
      - REJECTED
      - CLOSED
      example: PENDING
    AppealDecision:
      type: string
      description: 이의 처리 결정값. PENDING으로는 되돌릴 수 없습니다
      enum:
      - ACCEPTED
      - REJECTED
      example: ACCEPTED
    ReportTargetType:
      type: string
      description: '신고 대상 종류. MEMBER 특정 참가자 · SESSION 세션 전체'
      enum:
      - MEMBER
      - SESSION
      example: MEMBER
    ReportReasonCode:
      type: string
      description: '신고 사유. SEXUAL_CONTENT·VIOLENT_THREAT·INAPPROPRIATE_SCREEN은 HIGH,

        AD_SPAM·ETC는 NORMAL 등급으로 접수됩니다

        '
      enum:
      - SEXUAL_CONTENT
      - VIOLENT_THREAT
      - AD_SPAM
      - INAPPROPRIATE_SCREEN
      - ETC
      example: INAPPROPRIATE_SCREEN
    ReportSeverity:
      type: string
      description: '신고 등급. HIGH 24시간 SLA · NORMAL 72시간 SLA'
      enum:
      - HIGH
      - NORMAL
      example: HIGH
    ReportStatus:
      type: string
      description: '신고 케이스 상태. PENDING 처리 대기 · RESOLVED 조치 없이 종결 · REJECTED 기각 · SANCTIONED 제재 확정'
      enum:
      - PENDING
      - RESOLVED
      - REJECTED
      - SANCTIONED
      example: PENDING
    ReportDecision:
      type: string
      description: 신고 처리 결정값. PENDING으로는 되돌릴 수 없습니다
      enum:
      - RESOLVED
      - REJECTED
      - SANCTIONED
      example: SANCTIONED
    SanctionType:
      type: string
      description: '제재 종류. TEMP 기간제(`days` 필수) · PERMANENT 영구(`endsAt`이 `null`)'
      enum:
      - TEMP
      - PERMANENT
      example: TEMP
    DecidedBy:
      type: string
      description: '판정 주체. AI 자동 판정 · ADMIN 운영자 · SYSTEM 배치(파기가 종결한 CLOSED와만 짝)'
      enum:
      - AI
      - ADMIN
      - SYSTEM
      example: ADMIN
    BadgeCode:
      type: string
      description: 뱃지 코드. v1에는 목표 달성 뱃지 하나뿐입니다
      enum:
      - GOAL_ACHIEVED
      example: GOAL_ACHIEVED
    TargetMinutes:
      type: integer
      description: 하루 목표 시간(분). 대기열이 이 값으로 갈립니다
      enum:
      - 60
      - 120
      - 180
      - 240
      example: 120
    PeriodDays:
      type: integer
      description: 개인 목표 기간(일)
      enum:
      - 7
      - 14
      - 30
      example: 14
    DevBatchName:
      type: string
      description: >-
        수동 트리거 가능한 배치. B1 세션 종료 · B2 대기 만료 · B4 탈퇴 파기 · B5 충전 승인 기한 만료.
        B3(SLA 마킹)은 폐지됐습니다
      enum:
      - B1
      - B2
      - B4
      - B5
      example: B1
    AgreementItem:
      type: object
      description: 가입 요청에 함께 싣는 약관 동의 한 건
      required:
      - type
      - agreed
      properties:
        type:
          $ref: '#/components/schemas/AgreementType'
        agreed:
          type: boolean
          example: true
    LoginRequest:
      type: object
      required:
      - provider
      - authorizationCode
      - agreements
      properties:
        provider:
          $ref: '#/components/schemas/SocialProvider'
        authorizationCode:
          type: string
          description: '소셜에서 받은 인가 코드. `provider=DEV`이면 이 값이 그대로 `provider_user_id`가 됩니다'
          example: hK9x2Lm...
        agreements:
          type: array
          description: '필수 2종(TOS·PRIVACY)이 모두 `agreed=true`여야 가입됩니다.

            MARKETING은 선택이며 누락되거나 `false`이면 동의 행을 만들지 않습니다.

            '
          items:
            $ref: '#/components/schemas/AgreementItem'
      example:
        provider: KAKAO
        authorizationCode: hK9x2Lm...
        agreements:
        - type: TOS
          agreed: true
        - type: PRIVACY
          agreed: true
        - type: MARKETING
          agreed: false
    LoginResponse:
      type: object
      required:
      - accessToken
      - memberId
      - isNewMember
      - needsBirthdate
      - ageVerification
      - loginResult
      properties:
        accessToken:
          type: string
          description: 24시간 유효한 JWT. 갱신 토큰은 없습니다
        memberId:
          type: integer
          format: int64
        isNewMember:
          type: boolean
          description: 이 요청으로 새로 가입했는지
        needsBirthdate:
          type: boolean
          description: '`true`면 생년월일 입력 화면(AU-3)으로 보내야 합니다'
        ageVerification:
          $ref: '#/components/schemas/AgeVerification'
        loginResult:
          $ref: '#/components/schemas/LoginResult'
      example:
        accessToken: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMDQyIn0...
        memberId: 1042
        isNewMember: true
        needsBirthdate: true
        ageVerification: REQUIRED
        loginResult: NORMAL
    GoalResponse:
      type: object
      description: 개인 목표 챌린지 기간
      required:
      - goalId
      - periodDays
      - startedOn
      - progressDays
      - status
      properties:
        goalId:
          type: integer
          format: int64
          example: 88
        periodDays:
          $ref: '#/components/schemas/PeriodDays'
        startedOn:
          type: string
          format: date
          example: '2026-08-01'
        progressDays:
          type: integer
          description: 달성 진행도 — `min(streak.current, started_on 이후 완주일 수)`.
            달성이 두 조건의 AND라 진행률도 최솟값이며, 화면은 `progressDays / periodDays`로
            그립니다. `streak.current`로 그리면 목표 시작 전의 연속이 진행으로 잘못 보입니다.
            ACHIEVED 목표는 `periodDays`로 고정됩니다
          example: 5
        status:
          $ref: '#/components/schemas/GoalStatus'
        achievedAt:
          type: string
          format: date-time
          nullable: true
          description: 달성 시각. 미달성이면 `null`
          example: null
    StreakSummary:
      type: object
      description: 연속 완주일. 하루에 여러 세션을 완주해도 1일로 셉니다
      required:
      - current
      properties:
        current:
          type: integer
          example: 5
        lastCompletedOn:
          type: string
          format: date
          nullable: true
          example: '2026-08-11'
    SanctionSummary:
      type: object
      description: 유효한 제재. 없으면 상위 필드가 `null`입니다
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/SanctionType'
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: 해제 시각. PERMANENT면 `null`
          example: '2026-08-15T00:00:00+09:00'
    MemberMeResponse:
      type: object
      required:
      - memberId
      - nickname
      - role
      - memberStatus
      - ageVerification
      - mediaConsented
      - pointBalance
      - streak
      - badges
      properties:
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
          description: 서버가 만든 표시용 닉네임. 타인에게 보이는 화면은 이 값만 씁니다
        role:
          $ref: '#/components/schemas/MemberRole'
        memberStatus:
          $ref: '#/components/schemas/MemberStatus'
        ageVerification:
          $ref: '#/components/schemas/AgeVerification'
        mediaConsented:
          type: boolean
          description: 캠 영상 온디바이스 분석 동의 여부. `false`면 SS-2 토큰 발급이 막힙니다
        pointBalance:
          type: integer
          description: 잔액 캐시. 진실은 포인트 원장입니다
        goal:
          allOf:
          - $ref: '#/components/schemas/GoalResponse'
          nullable: true
          description: 목표 미설정이면 `null`
        streak:
          $ref: '#/components/schemas/StreakSummary'
        activeSession:
          allOf:
          - $ref: '#/components/schemas/ActiveSessionSummary'
          nullable: true
          description: 진행 중(LIVE) 세션에 ACTIVE·PAUSED로 참가 중인 행. 없으면 `null`.
            앱을 재시작한 클라이언트가 재접속 유예(D13) 안에 SS-2를 다시 받으러 갈 진입점입니다
        sanction:
          allOf:
          - $ref: '#/components/schemas/SanctionSummary'
          nullable: true
          description: 유효 제재가 없으면 `null`
        badges:
          type: array
          description: 보유 뱃지. ACHIEVED 목표 행에서 파생하며, 같은 코드는 첫 획득 시각으로
            한 번만 실립니다. 없으면 빈 배열입니다
          items:
            $ref: '#/components/schemas/BadgeSummary'
      example:
        memberId: 1042
        nickname: 익명 치타037
        role: PARTICIPANT
        memberStatus: ACTIVE
        ageVerification: VERIFIED
        mediaConsented: true
        pointBalance: 1300
        goal:
          goalId: 88
          periodDays: 14
          startedOn: '2026-08-01'
          progressDays: 5
          status: ACTIVE
          achievedAt: null
        streak:
          current: 5
          lastCompletedOn: '2026-08-11'
        activeSession:
          sessionId: 5501
          participantStatus: ACTIVE
          targetMinutes: 120
          startedAt: '2026-08-12T09:00:00+09:00'
          endsAt: '2026-08-12T11:00:00+09:00'
        sanction: null
        badges:
        - code: GOAL_ACHIEVED
          earnedAt: '2026-08-10T21:00:00+09:00'
    BadgeSummary:
      type: object
      required:
      - code
      - earnedAt
      properties:
        code:
          $ref: '#/components/schemas/BadgeCode'
        earnedAt:
          type: string
          format: date-time
    ActiveSessionSummary:
      type: object
      description: LEFT·EVICTED 참가와 끝난 세션은 실리지 않습니다(MT-1 3단계와 같은 판정식이라
        최대 1건)
      required:
      - sessionId
      - participantStatus
      - targetMinutes
      - startedAt
      - endsAt
      properties:
        sessionId:
          type: integer
          format: int64
        participantStatus:
          $ref: '#/components/schemas/ParticipantStatus'
        targetMinutes:
          type: integer
        startedAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    BirthDateRequest:
      type: object
      required:
      - birthDate
      properties:
        birthDate:
          type: string
          format: date
          description: 미래 일자·형식 오류는 400 `VALIDATION_FAILED`
          example: '2005-03-01'
    AgeVerificationResponse:
      type: object
      required:
      - ageVerification
      properties:
        ageVerification:
          $ref: '#/components/schemas/AgeVerification'
      example:
        ageVerification: VERIFIED
    WithdrawalResponse:
      type: object
      required:
      - deleteScheduledAt
      properties:
        deleteScheduledAt:
          type: string
          format: date-time
          description: 실제 파기 예정 시각. 그때까지 재로그인하거나 AU-5로 철회하면 계정이 되살아납니다
          example: '2026-09-11T00:00:00+09:00'
    MediaConsentRequest:
      type: object
      required:
      - agreed
      properties:
        agreed:
          type: boolean
          description: '`true`만 받습니다. `false`는 400 `VALIDATION_FAILED`(미동의를 저장하지 않습니다)'
          example: true
    GoalRequest:
      type: object
      required:
      - periodDays
      properties:
        periodDays:
          $ref: '#/components/schemas/PeriodDays'
      example:
        periodDays: 14
    MatchRequestCreate:
      type: object
      required:
      - targetMinutes
      properties:
        targetMinutes:
          $ref: '#/components/schemas/TargetMinutes'
      example:
        targetMinutes: 120
    MatchRequestResponse:
      type: object
      required:
      - matchRequestId
      - status
      - targetMinutes
      - requestedAt
      - expiresAt
      - waitingCount
      - requiredCount
      properties:
        matchRequestId:
          type: integer
          format: int64
          example: 901
        status:
          $ref: '#/components/schemas/MatchRequestStatus'
        targetMinutes:
          $ref: '#/components/schemas/TargetMinutes'
        requestedAt:
          type: string
          format: date-time
          example: '2026-08-12T09:00:00+09:00'
        expiresAt:
          type: string
          format: date-time
          description: 이 시각을 넘기면 배치가 EXPIRED로 바꿉니다
          example: '2026-08-12T09:10:00+09:00'
        waitingCount:
          type: integer
          description: 같은 목표 시간에 대기 중인 인원
          example: 4
        requiredCount:
          type: integer
          description: 매칭 확정 인원. `waitingCount`가 여기 도달하면 성사됩니다
          example: 6
        sessionId:
          type: integer
          format: int64
          nullable: true
          description: '`status=MATCHED`일 때만 채워집니다. 값이 오면 폴링을 멈추고 SS-2로 넘어갑니다'
          example: null
    SessionParticipant:
      type: object
      description: 라이브 화면에 그릴 참가자 한 명. 실명·SNS 값은 어떤 경우에도 내려가지 않습니다
      required:
      - memberId
      - nickname
      - isMe
      - status
      - warningCount
      - paused
      - pauseUsed
      properties:
        memberId:
          type: integer
          format: int64
        nickname:
          type: string
        isMe:
          type: boolean
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        warningCount:
          type: integer
          description: 세션 내 누적 경고. 3이 되면 퇴출됩니다
        paused:
          type: boolean
        pauseUsed:
          type: boolean
          description: 세션당 1회. 복귀해도 `true`로 남습니다
        joinedAt:
          type: string
          format: date-time
          nullable: true
          description: '최초 입장 시각. `null`이면 매칭은 됐지만 아직 룸에 들어오지 않은 참가자입니다'
        goalText:
          type: string
          nullable: true
          maxLength: 50
        evictionId:
          type: integer
          format: int64
          nullable: true
          description: >-
            이의 신청(AP-1)의 진입 번호. `isMe=true`인 행에서 본인이 퇴출된 경우에만 값이 있고
            나머지는 전부 `null`입니다. 남의 퇴출 번호는 어떤 경우에도 내려가지 않습니다
    SessionDetailResponse:
      type: object
      required:
      - sessionId
      - status
      - targetMinutes
      - startedAt
      - endsAt
      - roomName
      - participants
      properties:
        sessionId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/SessionStatus'
        targetMinutes:
          $ref: '#/components/schemas/TargetMinutes'
        startedAt:
          type: string
          format: date-time
          description: 6인 확정 시각
        endsAt:
          type: string
          format: date-time
          description: '`startedAt + targetMinutes`'
        endedAt:
          type: string
          format: date-time
          nullable: true
        endReason:
          allOf:
          - $ref: '#/components/schemas/SessionEndReason'
          nullable: true
        roomName:
          type: string
          description: LiveKit 룸 이름. `molock-{sessionId}`
        participants:
          type: array
          description: LEFT·EVICTED 참가자도 포함합니다. 상태를 병기하므로 자리 수 변화가 화면에 드러납니다
          items:
            $ref: '#/components/schemas/SessionParticipant'
      example:
        sessionId: 5501
        status: LIVE
        targetMinutes: 120
        startedAt: '2026-08-12T09:00:00+09:00'
        endsAt: '2026-08-12T11:00:00+09:00'
        endedAt: null
        endReason: null
        roomName: molock-5501
        participants:
        - memberId: 1042
          nickname: 익명 치타037
          isMe: true
          status: ACTIVE
          warningCount: 1
          paused: false
          pauseUsed: false
          joinedAt: '2026-08-12T09:00:14+09:00'
          goalText: 정처기 필기 3단원
          evictionId: null
        - memberId: 1088
          nickname: 익명수달12
          isMe: false
          status: PAUSED
          warningCount: 0
          paused: true
          pauseUsed: true
          joinedAt: null
          goalText: 토익 LC 파트3
          evictionId: null
    LivekitTokenResponse:
      type: object
      required:
      - url
      - roomName
      - token
      - identity
      - canPublishAudio
      - expiresInSeconds
      properties:
        url:
          type: string
          description: LiveKit 접속 주소
        roomName:
          type: string
        token:
          type: string
          description: 단기 접속 토큰. 서버는 토큰만 발급하고 미디어는 경유하지 않습니다
        identity:
          type: string
          description: '`memberId`의 문자열 표현. SS-10 웹훅이 이 값으로 참가자를 찾습니다'
        canPublishAudio:
          type: boolean
          description: '항상 `false`. 토큰 grant에서 오디오 publish 권한을 빼 서버가 기본 Mute를 강제합니다.

            클라이언트는 이 값을 보고 마이크 버튼을 비활성으로 그립니다.

            '
        expiresInSeconds:
          type: integer
          description: '`livekit.token-ttl-seconds` 값'
      example:
        url: wss://molock.livekit.cloud
        roomName: molock-5501
        token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        identity: '1042'
        canPublishAudio: false
        expiresInSeconds: 3600
    SessionGoalRequest:
      type: object
      required:
      - goalText
      properties:
        goalText:
          type: string
          minLength: 1
          maxLength: 50
          description: 빈 문자열·50자 초과는 400 `VALIDATION_FAILED`
          example: 정처기 필기 3단원까지
    SessionGoalResponse:
      type: object
      required:
      - goalText
      properties:
        goalText:
          type: string
          example: 정처기 필기 3단원까지
    AbsenceEventRequest:
      type: object
      description: 자기 자신의 얼굴 미검출 시작·종료만 보고합니다. 타인에 대한 판정은 보낼 수 없습니다
      required:
      - type
      - clientSeq
      - occurredAt
      properties:
        type:
          $ref: '#/components/schemas/AbsenceEventType'
        clientSeq:
          type: integer
          format: int64
          minimum: 0
          description: 세션 내 단조 증가하는 클라이언트 시퀀스. 재전송은 이 값으로 흡수됩니다. 0 이상이며 음수는 400 `VALIDATION_FAILED`
        occurredAt:
          type: string
          format: date-time
          description: 지속시간(60초 초과) 계산의 기준 시각입니다. 서버 수신 시각이 아니라 이 값의 간격으로 판정합니다
            — 수신 시각으로 재면 네트워크 지연이 자리비움 시간으로 둔갑합니다. 서버는 수신 시각을 감사용으로만 함께 저장합니다.
            허용 범위는 [세션 시작 −5초, 현재 +5초]
      example:
        type: START
        clientSeq: 17
        occurredAt: '2026-08-12T09:41:12+09:00'
    AbsenceEventResponse:
      type: object
      required:
      - accepted
      - warningCount
      - evicted
      - pointDelta
      properties:
        accepted:
          type: boolean
        warningCount:
          type: integer
        evicted:
          type: boolean
        evictionId:
          type: integer
          format: int64
          nullable: true
          description: 퇴출됐을 때만 채워집니다. 이의 신청(AP-1) 경로의 키입니다
        pointDelta:
          type: integer
          description: 이 요청으로 발생한 포인트 증감. 퇴출이면 패널티만큼 음수
        closedAbsenceSeconds:
          type: integer
          format: int64
          nullable: true
          description: 이 보고로 닫힌 자리비움 구간의 지속 초. 닫힌 구간이 없으면(START 보고,
            짝 없는 END, PAUSED 중에 도착한 END) null이고, 임계 이하로 닫혀 경고가 없을 때도
            값은 실립니다 — 몇 초로 판정됐는지가 당사자가 이의를 쓸 근거입니다. 판정 구간은
            ends_at에서 양끝을 자르므로 자리를 지킬 의무가 있던 시간과 겹친 만큼만 세고,
            겹침이 없으면 0입니다. SS-5의 같은 필드와 이름·형태가 같습니다
      example:
        accepted: true
        warningCount: 3
        evicted: true
        evictionId: 77
        pointDelta: -300
        closedAbsenceSeconds: 81
    PauseStartResponse:
      type: object
      required:
      - status
      - pausedAt
      - pauseLimitSeconds
      - resumeDueAt
      - warningIssued
      - warningCount
      properties:
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        pausedAt:
          type: string
          format: date-time
        pauseLimitSeconds:
          type: integer
          description: 상한 시간(초). 넘겨서 복귀하면 경고 1회
        resumeDueAt:
          type: string
          format: date-time
        warningIssued:
          type: boolean
          description: 시작과 함께 마감된 자리비움 구간으로 경고가 붙었는지. 1·2회째는 화장실
            모드가 정상 시작되므로 이 값이 없으면 사용자는 경고가 는 것을 모른다
        warningCount:
          type: integer
          description: 마감 반영 후의 누적 경고 수. 3회면 퇴출이라 이 응답은 409로 대체된다
        closedAbsenceSeconds:
          type: integer
          format: int64
          nullable: true
          description: 마감된 자리비움 구간의 지속 초. 마감할 구간이 없었으면 null이고,
            경고가 붙지 않은 경우에도 값은 실린다 — 이의를 쓸 때 본인이 댈 유일한 근거다
      example:
        status: PAUSED
        pausedAt: '2026-08-12T09:50:00+09:00'
        pauseLimitSeconds: 600
        resumeDueAt: '2026-08-12T10:00:00+09:00'
        warningIssued: true
        warningCount: 1
        closedAbsenceSeconds: 90
    PauseEndResponse:
      type: object
      required:
      - status
      - elapsedSeconds
      - warningIssued
      - warningCount
      - evicted
      properties:
        status:
          $ref: '#/components/schemas/ParticipantStatus'
        elapsedSeconds:
          type: integer
        warningIssued:
          type: boolean
          description: 상한을 넘겨 경고가 붙었는지
        warningCount:
          type: integer
        evicted:
          type: boolean
          description: 그 경고가 3회째여서 퇴출됐는지
      example:
        status: ACTIVE
        elapsedSeconds: 730
        warningIssued: true
        warningCount: 2
        evicted: false
    LeaveSessionRequest:
      type: object
      required:
      - reason
      properties:
        reason:
          $ref: '#/components/schemas/LeaveReason'
      example:
        reason: DEVICE_ISSUE
    SessionStreak:
      type: object
      description: 이 세션 시점의 Streak. 완주일 기준 역방향 연속 일수로 계산합니다
      required:
      - before
      - after
      - countedToday
      properties:
        before:
          type: integer
        after:
          type: integer
        countedToday:
          type: boolean
          description: '`false`면 같은 날 이미 다른 세션으로 완주가 기록돼 Streak가 중복 증가하지 않았다는 뜻입니다'
    MySessionResult:
      type: object
      required:
      - completed
      - participantStatus
      - warningCount
      - pointAwarded
      - streak
      - goalAchieved
      - warnings
      properties:
        completed:
          type: boolean
          description: 세션 종료 시각에 ACTIVE·PAUSED였는지
        participantStatus:
          $ref: '#/components/schemas/ParticipantStatus'
        leftReason:
          allOf:
          - $ref: '#/components/schemas/LeftReason'
          nullable: true
          description: '`DEVICE_ISSUE`인데 퇴장을 누른 적이 없다면 연결이 90초 넘게 끊겨 서버가 자동 처리한 경우입니다'
        warningCount:
          type: integer
        pointAwarded:
          type: integer
          description: '`targetMinutes` 기준입니다. 조기 종료로 일찍 끝났어도 줄어들지 않습니다'
        streak:
          $ref: '#/components/schemas/SessionStreak'
        goalAchieved:
          type: boolean
        badgeCode:
          allOf:
          - $ref: '#/components/schemas/BadgeCode'
          nullable: true
        evictionId:
          type: integer
          format: int64
          nullable: true
          description: >-
            이의 신청(AP-1)의 진입 번호. 본인이 그 세션에서 퇴출된 경우에만 값이 있고 아니면
            `null`입니다. `participants[]`에는 실리지 않습니다
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/MyWarningItem'
          description: >-
            본인 경고 전량과 근거 구간. 경고가 없으면 빈 배열입니다. 되짚기는 관리자
            심사(AD-9)와 같은 경로라 두 화면이 같은 구간을 봅니다. `participants[]`의
            남의 행에는 어떤 경우에도 실리지 않습니다
    MyWarningItem:
      type: object
      description: >-
        본인 경고 1건과 근거 자리비움 구간. AppealWarningItem에서 관리자 전용
        분석값(`reportSkewSeconds`·`concurrentReporterCount`)을 뺀 모양입니다
      required:
      - seq
      - basis
      - issuedAt
      properties:
        seq:
          type: integer
          description: 세션 안에서의 경고 번호 1~3
        basis:
