          description: '신고 대상 ID. `targetType`에 맞는 ID를 넣습니다.

            `PROOF`면 `proofId`, `MEMBER`면 `memberId`, `POST`면 `postId`입니다.

            '
          example: 3401
        reasonCode:
          $ref: '#/components/schemas/ReportReasonCode'
        detail:
          type: string
          description: 신고 상세 내용. 위험한 표현이 들어 있으면 그 내용만 제거되고 접수는 그대로 진행됩니다.
          maxLength: 500
          example: 인증 사진이 목표와 전혀 관계없는 사진입니다.
      example:
        targetType: PROOF
        targetId: 3401
        reasonCode: FAKE_PROOF
        detail: 인증 사진이 목표와 전혀 관계없는 사진입니다.
    CreateReportResponse:
      type: object
      description: 접수된 신고 케이스
      required:
      - caseId
      - severity
      - receivedAt
      properties:
        caseId:
          type: integer
          format: int64
          description: 접수된 신고 케이스 ID. 같은 대상에 여러 명이 신고하면 같은 케이스로 묶입니다.
          example: 907
        severity:
          $ref: '#/components/schemas/ReportSeverity'
        receivedAt:
          type: string
          format: date-time
          description: 접수 시각
          example: '2026-08-12T14:30:00+09:00'
      example:
        caseId: 907
        severity: HIGH
        receivedAt: '2026-08-12T14:30:00+09:00'
    CreatePostRequest:
      type: object
