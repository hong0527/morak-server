        '200':
          description: '임시 열람 URL입니다. `expiresInSeconds`가 지나면 이미지가 끊기므로 다시 발급받으세요.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProofMediaResponse'
        '400':
          description: '`NOT_REPORTED_PROOF` 열람 조건을 만족하지 않음 → 열람 버튼을 조건 충족 건에만 노출합니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: NOT_REPORTED_PROOF
