      - avgDenominator
      properties:
        avgProofRate:
          type: number
          format: double
          description: 그룹 평균 인증률. 0.0 ~ 1.0
          example: 0.8571
        criteriaMet:
          type: boolean
          description: 그룹 기준(`criteria.groupAvgProofRate`) 충족 여부
          example: true
        avgDenominator:
          type: integer
          description: 그룹 평균을 낸 인원 수. **그룹 상세의 `memberCount`와 다른 값입니다.**
          example: 5
