                  details: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`PROOF_NOT_FOUND` 없는 인증물 → 상세를 다시 불러옵니다'
          content:
            application/json:
              schema:
