      description: "운영자 전용입니다. 일반 사용자 앱에서는 호출하지 않습니다.\n\n자동 판정이 애매해 관리자 확정이 필요한 건들을 조회합니다.\n\n- `COMPLETION` 건을 확정하면 그 챌린지의\
        \ 완주 리포트가 만들어집니다.\n  확정 전까지 참가자는 리포트 조회에서 **202 `REPORT_NOT_READY`** 를 받습니다.\n"
      parameters:
      - name: type
        in: query
        required: false
        description: 검토 종류로 거릅니다.
        schema:
          $ref: '#/components/schemas/AiReviewType'
        example: COMPLETION
      - name: status
        in: query
        required: false
        description: 검토 상태로 거릅니다.
        schema:
          $ref: '#/components/schemas/AiReviewStatus'
        example: PENDING
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: '검토 대기 항목 목록입니다.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
  /admin/ai-reviews/{reviewId}:
    patch:
      tags:
      - 관리자
      summary: AI 검토 확정
      operationId: decideAiReview
      description: "운영자 전용입니다. 일반 사용자 앱에서는 호출하지 않습니다.\n\n자동 판정이 애매한 건을 관리자가 확정합니다.\n\n- `decision`이 `CONFIRM`이면 자동 판정을 그대로\
        \ 유지하고, `OVERRIDE`이면 뒤집습니다.\n- `COMPLETION` 건을 `OVERRIDE`할 때만 `groupAvgRate`, `groupMet`을 함께 보냅니다.\n- **`COMPLETION`\
        \ 건을 확정하면 그 챌린지의 완주 리포트가 만들어집니다.**\n  확정 전까지 참가자는 리포트 조회에서 202를 받습니다.\n"
      parameters:
      - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideAiReviewRequest'
      responses:
        '200':
          description: '확정 후의 검토 항목을 돌려줍니다. `reportGenerated`가 `true`면 완주 리포트가 생성되어

            참가자가 더 이상 202를 받지 않습니다.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReviewDecisionResponse'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminForbidden'
        '404':
          description: '`AI_REVIEW_NOT_FOUND` 없는 검토 항목 → 큐를 다시 불러옵니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AI_REVIEW_NOT_FOUND
                  message: 존재하지 않는 검토 항목입니다.
                  details: {}
        '409':
          description: '`ALREADY_PROCESSED` 이미 확정된 항목 → 큐를 다시 불러와 최신 상태를 보여줍니다'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: ALREADY_PROCESSED
                  message: 이미 확정된 검토 항목입니다.
                  details: {}
