          type: string
          format: date-time
          description: 접수 시각
          example: '2026-08-12T14:30:00+09:00'
      example:
        reasonCode: FAKE_PROOF
        detail: 인증 사진이 목표와 전혀 관계없는 사진입니다.
        receivedAt: '2026-08-12T14:30:00+09:00'
    AdminReportHistoryEntry:
      type: object
      description: 처리 이력 한 건
