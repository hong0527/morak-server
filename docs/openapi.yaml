      properties:
        groupId:
          type: integer
          format: int64
          description: 후기를 쓸 챌린지 ID. 완주 리포트가 만들어진 챌린지여야 합니다.
          example: 12
        comment:
          type: string
          description: 한 줄 후기. 200자 이하. 연락처·계정·링크가 들어가면 422 `CONTENT_BLOCKED`가 납니다.
          maxLength: 200
          example: 100일 동안 하루도 안 빠지고 달렸습니다
      example:
        groupId: 12
        comment: 100일 동안 하루도 안 빠지고 달렸습니다
    CreatePostResponse:
      type: object
      description: 생성된 게시글
      required:
      - postId
      - createdAt
      properties:
        postId:
          type: integer
          format: int64
          description: 생성된 게시글 ID
          example: 512
        createdAt:
          type: string
          format: date-time
          description: 작성 시각
          example: '2026-08-12T14:30:00+09:00'
      example:
        postId: 512
        createdAt: '2026-08-12T14:30:00+09:00'
    PostSummary:
      type: object
      description: 게시판 목록에 나오는 게시글 한 건
      required:
      - postId
      - authorAlias
      - category
      - periodDays
      - provedDays
      - proofRate
      - completed
      - badgeCode
      - likeCount
      - myLiked
      - createdDate
      properties:
        postId:
          type: integer
          format: int64
          description: 게시글 ID
          example: 512
        authorAlias:
          type: string
          description: 작성자 별칭. **그룹 화면에서 쓰던 닉네임과 다른 값입니다.**
          example: 익명 토끼47
        category:
          $ref: '#/components/schemas/GoalCategory'
        periodDays:
          type: integer
          description: 챌린지 기간(일). 30 / 60 / 100
          enum:
          - 30
          - 60
          - 100
          example: 100
        provedDays:
          type: integer
          description: 인증한 날 수
          example: 86
        proofRate:
          type: number
          format: double
          description: 인증률. 0.0 ~ 1.0
          example: 0.86
        completed:
          type: boolean
          description: 완주 여부
          example: true
        badgeCode:
          $ref: '#/components/schemas/BadgeCode'
        comment:
          type: string
          description: 한 줄 후기. 작성 시 비웠으면 빈 문자열로 옵니다.
          example: 100일 동안 하루도 안 빠지고 달렸습니다
        likeCount:
          type: integer
          description: 좋아요 수
          example: 23
        myLiked:
          type: boolean
          description: 내가 좋아요를 눌렀는지
          example: false
        createdDate:
          type: string
          format: date
          description: 작성 일자. **시·분은 내려오지 않습니다.**
          example: '2026-08-12'
      example:
        postId: 512
        authorAlias: 익명 토끼47
        category: EXERCISE
        periodDays: 100
        provedDays: 86
        proofRate: 0.86
        completed: true
        badgeCode: SILVER
        comment: 100일 동안 하루도 안 빠지고 달렸습니다
        likeCount: 23
        myLiked: false
        createdDate: '2026-08-12'
    PostListResponse:
