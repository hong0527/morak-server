          method: PHOTO
          submittedAt: '2026-08-12T14:30:00+09:00'
          mediaViewable: true
          stickerCounts:
            CLAP: 3
            MUSCLE: 1
            FIRE: 2
          myReactions:
          - CLAP
          - FIRE
