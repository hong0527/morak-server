        '
      required:
      - status
      properties:
        status:
          type: string
          description: '처리 결과.

            RESOLVED 조치 없이 종결 · REJECTED 신고 반려 · SANCTIONED 제재와 함께 종결

            '
          enum:
          - RESOLVED
          - REJECTED
          - SANCTIONED
          example: SANCTIONED
