      - memberId
      - type
      - active
      - startsAt
      properties:
        sanctionId:
          type: integer
          format: int64
          description: 제재 ID
          example: 331
        memberId:
          type: integer
          format: int64
          description: 제재 대상 회원 ID
          example: 2482
