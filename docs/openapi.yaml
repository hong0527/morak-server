      summary: 관리자 촬영물 열람
      operationId: getAdminProofMedia
      description: '운영자 전용입니다. 일반 사용자 앱에서는 호출하지 않습니다.

        신고 대상이거나 AI 검토 큐에 올라온 인증물만 열람할 수 있습니다.

