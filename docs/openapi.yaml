openapi: 3.0.3
info:
  title: 모락(Morak) API
  version: 1.0.0
  description: '6인 랜덤 매칭 목표 챌린지 서비스 ''모락''의 백엔드 API입니다.

    분야·하루 목표시간·기간 세 가지 조건을 고르면 같은 조건의 6명이 자동으로 묶이고,

    매일 사진 한 장으로 인증하며 기간을 완주합니다. 채팅은 없고 스티커로만 응원합니다.

    ## 인증

    로그인으로 받은 토큰을 `Authorization: Bearer {accessToken}` 헤더에 넣어 보냅니다.

    토큰은 24시간 유효하며 갱신(refresh) 토큰은 없습니다. 만료되면 다시 로그인해야 합니다.

    ## 오류 응답

    모든 실패 응답은 아래 형태로 통일되어 있습니다.

    ```json

    { "error": { "code": "DUPLICATE_DAILY_PROOF", "message": "오늘 인증을 이미 제출했습니다.", "details": {} } }

    ```

    화면 분기는 `message`가 아니라 **`code`** 로 하세요. 문구는 다듬어질 수 있지만 코드는 바뀌지 않습니다.

    ## 어느 API에서나 날 수 있는 오류

    아래 두 가지는 모든 경로에 해당하므로 개별 API 설명에서는 생략했습니다.

    | 상태 | 코드 | 언제 | 화면 처리 |

    | --- | --- | --- | --- |

    | 404 | `ENDPOINT_NOT_FOUND` | 없는 주소를 호출했을 때 | 개발 중 오류. 경로를 확인하세요 |

    | 500 | `INTERNAL_SERVER_ERROR` | 서버 오류 | 잠시 후 다시 시도하도록 안내 |

    인증·제재·연령 관련 401·403은 각 API의 응답 설명에 적혀 있습니다.

    '
servers:
- url: http://localhost:8080/api
  description: 개발
- url: https://api.morak.example.com/api
  description: 운영 (배포 시 확정)
tags:
- name: 로그인과 회원
  description: 소셜 로그인, 내 정보, 연령 확인, 탈퇴
- name: 매칭
  description: 조건을 골라 6인 그룹에 배정받기
- name: 챌린지 그룹
  description: 참여 중인 챌린지 조회와 퇴장
- name: 일일 인증
  description: 하루 한 번 사진으로 인증하기
- name: 응원 스티커
  description: 같은 그룹 멤버의 인증에 스티커 남기기
- name: 대시보드
  description: 그룹의 오늘 현황
- name: 완주 리포트
  description: 챌린지 종료 후 완주 판정 결과
- name: 신고
  description: 부적절한 인증·사용자·게시글 신고
- name: 완주 게시판
  description: 완주 기록 자랑하기
- name: 관리자
  description: 운영자 전용. 일반 사용자 앱에서는 호출하지 않습니다
security:
- bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 로그인 응답의 `accessToken`을 넣습니다. 24시간 유효합니다.
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: 화면 분기에 쓰는 값
              example: DUPLICATE_DAILY_PROOF
            message:
              type: string
              description: 사용자에게 그대로 보여줘도 되는 문구
              example: 오늘 인증을 이미 제출했습니다.
            details:
              type: object
              additionalProperties: true
              description: 추가 정보. 없으면 빈 객체
    GoalCategory:
      type: string
      description: '목표 분야.

        EXERCISE 운동 · STUDY 공부 · READING 독서 · DIET 식단 · SLEEP 수면 · ETC 기타

        '
      enum:
      - EXERCISE
      - STUDY
      - READING
      - DIET
      - SLEEP
      - ETC
      example: EXERCISE
    PeriodDays:
      type: integer
      description: 챌린지 기간(일)
      enum:
      - 30
      - 60
      - 100
      example: 30
    DailyTargetMinutes:
      type: integer
      description: 하루 목표 시간(분)
      enum:
      - 20
      - 30
      - 60
      - 120
      example: 60
    SocialProvider:
      type: string
      description: 소셜 로그인 제공자. 이번 버전의 실제 연동 범위는 팀 확정 후 결정됩니다.
      enum:
      - KAKAO
      - NAVER
      - GOOGLE
      - APPLE
      example: KAKAO
    MemberStatus:
      type: string
      description: '회원 상태.

        ACTIVE 정상 · WITHDRAW_PENDING 탈퇴 신청함(철회 가능) · DELETED 탈퇴 완료

        '
      enum:
      - ACTIVE
      - WITHDRAW_PENDING
      - DELETED
    AgeVerification:
      type: string
      description: '연령 확인 상태.

        REQUIRED 생년월일 미입력(입력 화면으로 보내야 함) · VERIFIED 확인 완료 · UNDER_AGE 만 14세 미만

        '
      enum:
      - REQUIRED
      - VERIFIED
      - UNDER_AGE
    MatchRequestStatus:
      type: string
      description: '매칭 요청 상태.

        WAITING 대기 중 · MATCHED 그룹 생성됨 · CANCELLED 사용자가 취소 · EXPIRED 24시간 초과로 만료

        '
      enum:
      - WAITING
      - MATCHED
      - CANCELLED
      - EXPIRED
    GroupStatus:
      type: string
      description: 챌린지 상태. ACTIVE 진행 중 · ENDED 종료됨
      enum:
      - ACTIVE
      - ENDED
    GroupMemberStatus:
      type: string
      description: '내 참여 상태.

        ACTIVE 참여 중 · COMPLETED 끝까지 참여 · LEFT 중간에 나감 · REPORT_EXIT 신고하면서 나감

        '
      enum:
      - ACTIVE
      - LEFT
      - REPORT_EXIT
      - COMPLETED
    LeftReason:
      type: string
      description: '자율 퇴장 사유.

        PERSONAL 개인 사정 · SCHEDULE 일정이 안 맞음 · HEALTH 건강 문제 · ETC 기타

        '
      enum:
      - PERSONAL
      - SCHEDULE
      - HEALTH
      - ETC
    ProofAiStatus:
      type: string
      description: '인증 처리 상태.

        SCREENING 검사 중 · APPROVED 인증 완료 · PENDING_REVIEW 확인 중이지만 인증으로 인정 ·

        HOLD 다시 올려야 함 · BLOCKED 차단됨

        '
      enum:
      - SCREENING
      - APPROVED
      - PENDING_REVIEW
      - HOLD
      - BLOCKED
    StickerType:
      type: string
      description: 응원 스티커. CLAP 박수 · MUSCLE 근육 · FIRE 불꽃
      enum:
      - CLAP
      - MUSCLE
      - FIRE
    ReportTargetType:
      type: string
      description: 신고 대상. PROOF 인증 사진 · MEMBER 사용자 · POST 게시글
      enum:
      - PROOF
      - MEMBER
      - POST
    ReportReasonCode:
      type: string
      description: '신고 사유.

        INAPPROPRIATE_CONTENT 부적절한 사진 · ABUSIVE_LANGUAGE 욕설·비방 · SPAM_PROOF 도배·광고 ·

        FAKE_PROOF 가짜 인증 · PRIVACY_VIOLATION 개인정보 노출 · ETC 기타

        '
      enum:
      - INAPPROPRIATE_CONTENT
      - ABUSIVE_LANGUAGE
      - SPAM_PROOF
      - FAKE_PROOF
      - PRIVACY_VIOLATION
      - ETC
    ReportStatus:
      type: string
      description: 신고 처리 상태
      enum:
      - PENDING
      - RESOLVED
      - REJECTED
      - SANCTIONED
    ReportSeverity:
      type: string
      description: 신고 심각도
      enum:
      - HIGH
      - NORMAL
    SanctionType:
      type: string
      description: 제재 종류. TEMP 기간 제한 · PERMANENT 영구
      enum:
      - TEMP
      - PERMANENT
    PostStatus:
      type: string
      description: 게시글 상태. VISIBLE 공개 · HIDDEN 운영자가 가림 · DELETED 삭제됨
      enum:
      - VISIBLE
      - HIDDEN
      - DELETED
    BadgeCode:
      type: string
      description: 완주 배지. 완주 여부와 인증률로 서버가 계산합니다
      enum:
      - GOLD
      - SILVER
      - BRONZE
      - NONE
    PageMeta:
      type: object
      description: 목록 응답의 공통 페이지 정보
      required:
      - page
      - size
      - totalElements
      - totalPages
      properties:
        page:
          type: integer
          description: 현재 페이지. 0부터 시작
          example: 0
        size:
          type: integer
          description: 한 페이지 항목 수
          example: 20
        totalElements:
          type: integer
          description: 전체 항목 수
          example: 137
        totalPages:
          type: integer
          description: 전체 페이지 수
          example: 7
    MemberRole:
      type: string
      description: 회원 역할. PARTICIPANT 일반 참가자 · ADMIN 운영자(관리 탭 노출)
      enum:
      - PARTICIPANT
      - ADMIN
      example: PARTICIPANT
    LoginResult:
      type: string
      description: '로그인 처리 결과.

        NORMAL 일반 로그인 · RESTORED 탈퇴 대기 중이던 계정이 자동으로 되살아남

        '
      enum:
      - NORMAL
      - RESTORED
      example: NORMAL
    LoginRequest:
      type: object
      required:
      - provider
      - authorizationCode
      properties:
        provider:
          $ref: '#/components/schemas/SocialProvider'
        authorizationCode:
          type: string
          description: 소셜 로그인 후 받은 인가 코드
          example: 0987poiuLKJH
      example:
        provider: KAKAO
        authorizationCode: 0987poiuLKJH
    LoginResponse:
      type: object
      required:
      - accessToken
      - isNewMember
      - ageVerification
      - loginResult
      properties:
        accessToken:
          type: string
          description: 이후 요청에 쓰는 인증 토큰. 24시간 유효하고 재발급(refresh)은 없습니다
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMDI0IiwiZXhwIjoxNzg2NTQzMjAwfQ.9sQ0mQx3Yb1nJ2kTfVQ7hZa5cR8dLpEwUu4Ns6MgKvI
        isNewMember:
          type: boolean
          description: 이번 요청으로 새로 가입했는지
          example: false
        ageVerification:
          $ref: '#/components/schemas/AgeVerification'
        loginResult:
          $ref: '#/components/schemas/LoginResult'
      example:
        accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMDI0IiwiZXhwIjoxNzg2NTQzMjAwfQ.9sQ0mQx3Yb1nJ2kTfVQ7hZa5cR8dLpEwUu4Ns6MgKvI
        isNewMember: false
        ageVerification: VERIFIED
        loginResult: NORMAL
    Sanction:
      type: object
      description: 제재 정보. 제재가 없으면 `sanction` 자체가 `null`입니다
      required:
      - active
      - endsAt
      properties:
        active:
          type: boolean
          description: 지금 유효한 제재인지
          example: true
        endsAt:
          type: string
          format: date-time
          nullable: true
          description: 제재가 풀리는 시각. 영구 제재면 `null`
          example: '2026-08-19T14:30:00+09:00'
      example:
        active: true
        endsAt: '2026-08-19T14:30:00+09:00'
    MemberMeResponse:
      type: object
      required:
      - memberId
      - nickname
      - role
      - ageVerification
      - memberStatus
      - mediaConsented
      - sanction
      properties:
        memberId:
          type: integer
          format: int64
          description: 회원 식별자
          example: 1024
        nickname:
          type: string
          description: 표시용 닉네임. 다른 사람에게 보이는 이름입니다
          example: 익명 토끼47
        role:
          $ref: '#/components/schemas/MemberRole'
        ageVerification:
          $ref: '#/components/schemas/AgeVerification'
        memberStatus:
          allOf:
          - $ref: '#/components/schemas/MemberStatus'
          description: 이 API에서는 `ACTIVE` 또는 `WITHDRAW_PENDING`만 내려옵니다
        mediaConsented:
          type: boolean
          description: 촬영물 처리에 동의했는지
          example: true
        sanction:
          type: object
          allOf:
          - $ref: '#/components/schemas/Sanction'
          nullable: true
          description: 제재 정보. 제재가 없으면 `null`
      example:
        memberId: 1024
        nickname: 익명 토끼47
        role: PARTICIPANT
        ageVerification: VERIFIED
        memberStatus: ACTIVE
        mediaConsented: true
        sanction: null
    BirthDateRequest:
      type: object
      required:
      - birthDate
      properties:
        birthDate:
          type: string
          format: date
          description: 생년월일. `YYYY-MM-DD` 형식
          example: '2005-03-01'
      example:
        birthDate: '2005-03-01'
    AgeVerificationResponse:
      type: object
      required:
      - ageVerification
      properties:
        ageVerification:
          allOf:
          - $ref: '#/components/schemas/AgeVerification'
          description: 검증 결과. 이 응답에서는 `VERIFIED` 또는 `UNDER_AGE`만 내려옵니다
      example:
        ageVerification: VERIFIED
    WithdrawalResponse:
      type: object
      required:
      - deleteScheduledAt
      properties:
        deleteScheduledAt:
          type: string
          format: date-time
          description: 계정이 실제로 삭제되는 시각. 신청 시점부터 30일 뒤입니다
          example: '2026-09-11T14:30:00+09:00'
      example:
        deleteScheduledAt: '2026-09-11T14:30:00+09:00'
    MatchRequestCreateRequest:
      type: object
      required:
      - category
      - dailyTargetMinutes
      - periodDays
      properties:
        category:
          $ref: '#/components/schemas/GoalCategory'
        dailyTargetMinutes:
          $ref: '#/components/schemas/DailyTargetMinutes'
        periodDays:
          $ref: '#/components/schemas/PeriodDays'
        rejoinFromGroupId:
          type: integer
          format: int64
          description: 이전 그룹에 이어서 다시 참여하는 경우 그 그룹의 식별자. 선택 항목
          example: 12
      example:
        category: EXERCISE
        dailyTargetMinutes: 60
        periodDays: 30
        rejoinFromGroupId: 12
    MatchRequestCreateResponse:
      type: object
      required:
      - matchRequestId
      - status
      - requestedAt
      - expiresAt
      properties:
        matchRequestId:
          type: integer
          format: int64
          description: 매칭 요청 식별자. 취소할 때 씁니다
          example: 5821
        status:
          allOf:
          - $ref: '#/components/schemas/MatchRequestStatus'
          description: '이 응답에서는 `WAITING`(대기 중) 또는 `MATCHED`(그 자리에서 6명이 채워져 성사됨)만 내려옵니다

            '
        requestedAt:
          type: string
          format: date-time
          description: 요청한 시각
          example: '2026-08-12T14:30:00+09:00'
        expiresAt:
          type: string
          format: date-time
          description: 요청이 만료되는 시각. 요청 시각으로부터 24시간 뒤
          example: '2026-08-13T14:30:00+09:00'
        groupId:
          type: integer
          format: int64
          description: 성사됐을 때만 옵니다. 만들어진 그룹의 식별자
          example: 12
      example:
        matchRequestId: 5821
        status: WAITING
        requestedAt: '2026-08-12T14:30:00+09:00'
        expiresAt: '2026-08-13T14:30:00+09:00'
    MatchConditions:
      type: object
      description: 매칭 요청할 때 고른 조건
      required:
      - category
      - dailyTargetMinutes
      - periodDays
      properties:
        category:
          $ref: '#/components/schemas/GoalCategory'
        dailyTargetMinutes:
          $ref: '#/components/schemas/DailyTargetMinutes'
        periodDays:
          $ref: '#/components/schemas/PeriodDays'
      example:
        category: EXERCISE
        dailyTargetMinutes: 60
        periodDays: 30
    MyMatchRequestResponse:
      type: object
      required:
      - matchRequestId
      - status
      - requestedAt
      - expiresAt
      - groupId
      - conditions
      - waitingCount
      - requiredCount
      properties:
        matchRequestId:
          type: integer
          format: int64
          description: 매칭 요청 식별자
          example: 5821
        status:
          allOf:
          - $ref: '#/components/schemas/MatchRequestStatus'
          description: 이 응답에서는 `WAITING` 또는 `MATCHED`만 내려옵니다
        requestedAt:
          type: string
          format: date-time
          description: 요청한 시각
          example: '2026-08-12T14:30:00+09:00'
        expiresAt:
          type: string
          format: date-time
          description: 요청이 만료되는 시각
          example: '2026-08-13T14:30:00+09:00'
        groupId:
          type: integer
          format: int64
          nullable: true
          description: 성사됐으면 만들어진 그룹의 식별자, 대기 중이면 `null`
          example: null
        conditions:
          $ref: '#/components/schemas/MatchConditions'
        waitingCount:
          type: integer
          description: 같은 조건으로 지금 기다리고 있는 사람 수
          example: 4
        requiredCount:
          type: integer
          description: 그룹이 만들어지는 데 필요한 인원. 항상 `6`
          example: 6
      example:
        matchRequestId: 5821
        status: WAITING
        requestedAt: '2026-08-12T14:30:00+09:00'
        expiresAt: '2026-08-13T14:30:00+09:00'
        groupId: null
        conditions:
          category: EXERCISE
          dailyTargetMinutes: 60
          periodDays: 30
        waitingCount: 4
        requiredCount: 6
    GroupStatusFilter:
      type: string
      description: 내 그룹 목록을 거르는 챌린지 상태. ACTIVE 진행 중 · ENDED 종료됨
      enum:
      - ACTIVE
      - ENDED
      example: ACTIVE
    ProofMethod:
      type: string
      description: 인증 방식. PHOTO 사진 업로드 · LIVE_CAM 즉석 촬영
      enum:
      - PHOTO
      - LIVE_CAM
      example: PHOTO
    ProofStatus:
      type: string
      description: '화면에 표시하는 인증 상태.

        본인 행은 `SCREENING` `APPROVED` `PENDING_REVIEW` `HOLD` `BLOCKED` 중 하나이고,

        다른 멤버 행은 `APPROVED`(승인된 인증) 또는 `NONE`(그 외 전부)만 내려옵니다.

        '
      enum:
      - SCREENING
      - APPROVED
      - PENDING_REVIEW
      - HOLD
      - BLOCKED
      - NONE
      example: APPROVED
    StickerCounts:
      type: object
      description: 스티커 종류별 개수. 키는 `CLAP` `MUSCLE` `FIRE`
      properties:
        CLAP:
          type: integer
          description: 박수 개수
          example: 3
        MUSCLE:
          type: integer
          description: 근육 개수
          example: 1
        FIRE:
          type: integer
          description: 불꽃 개수
          example: 2
      example:
        CLAP: 3
        MUSCLE: 1
        FIRE: 2
    MyReactions:
      type: array
